<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASAVI · tableau de bord V1.2</title>
<!-- DSFR chargé pour la police Marianne uniquement -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
/* Gabarit DNUM (référence maquette BASAVI V8). V1.2 : portes de sortie, contact par canal, usage des filtres, erreurs et géolocalisation en sessions. */
:root{ --bf:#000091; --bf-soft:#f5f5fe; --fg:#161616; --mut:#666; --line:#e5e5e5; --bg:#ffffff; --track:#eeeeee; --gris:#9a9aa8; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Marianne,Arial,sans-serif}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;color:var(--bf)}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.tb{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--bf-soft);border-bottom:1px solid var(--line);font-size:13px}
.tb label{display:flex;gap:6px;align-items:center;color:#444}
.tb select,.tb input[type=date]{font:inherit;font-weight:500;border:1px solid var(--bf);border-radius:4px;padding:2px 6px;background:#fff;color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--bf);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:#fff;color:var(--bf);padding:2px 10px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--bf);color:#fff}
.src{display:flex;gap:8px;align-items:center;padding:8px 16px;font-size:12px;color:#3a3a3a;border-bottom:1px solid var(--line)}
.src::before{content:'';width:8px;height:8px;border-radius:50%;background:#18753c;flex-shrink:0}
.src b{color:var(--fg)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;padding:0 16px;border-bottom:1px solid var(--line);margin-top:8px}
.tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:8px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--bf);border-bottom-color:var(--bf);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--bf);outline-offset:2px}
main{padding:4px 16px 28px}
h2{font-size:16px;color:var(--bf);margin:22px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--bf-soft)}
h2 small{font-weight:400;color:var(--mut);font-size:13px}
.intro{margin:16px 0 0;padding:10px 12px;background:var(--bf-soft);border-radius:6px;font-size:13px;color:#333;max-width:900px}
.intro b{color:var(--bf)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-top:4px solid var(--bf);border-radius:6px;padding:10px 12px;min-width:0}
.tile .pil{font-size:11px;font-weight:700;color:var(--bf);text-transform:uppercase;letter-spacing:.04em}
.tile .lab{font-weight:700;font-size:13px;margin-top:2px}
.tile .v{font-size:24px;font-weight:700;color:var(--bf);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.tile .c{font-size:12px;color:var(--mut);line-height:1.35}
.tile.wait{border-top-color:#6a3d99;background:#f3edfb}
.tile.wait .pil,.tile.wait .v{color:#6a3d99} .tile.wait .v{font-size:15px}
.trend{font-size:12px;font-weight:700;color:#555;margin-top:4px}
.tip{border-bottom:1px dotted #8a8aa8;cursor:help}
.tip::after{content:" ⓘ";font-size:.85em;color:#8a8aa8}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.box h3{margin:0 0 6px;font-size:13px;color:var(--bf)}
.box h3 small{font-weight:400;color:var(--mut)}
.kv{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
.kv .big{font-size:22px;font-weight:700;color:var(--bf);font-variant-numeric:tabular-nums}
.kv .hint{font-size:12px;color:var(--mut)}
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:minmax(0,13rem) 1fr minmax(6rem,max-content);gap:8px;align-items:center}
.row .n{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t{background:var(--track);height:14px;border-radius:3px;overflow:hidden}
.row .f{height:100%;background:var(--bf);display:block}
.row.gris .f{background:var(--gris)} .row.gris .n{color:var(--mut)}
.row .v{text-align:right;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.sub .n{padding-left:14px;font-weight:400}
/* part en grand, nombre en petit et en gris */
.nb{font-size:.85em;font-weight:400;color:var(--mut);margin-left:6px}
.stack{display:flex;height:20px;border-radius:4px;overflow:hidden;margin:6px 0;background:var(--track)}
.stack span{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pend{border:1px dashed #d3c2ec;background:#f3edfb;color:#6a3d99;border-radius:5px;padding:6px 10px;font-size:12px;margin-top:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.tbl th{text-align:left;color:var(--mut);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line)}
table.tbl td{padding:5px 8px;border-bottom:1px solid var(--line)}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
table.tbl tr.gris td{color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);font-size:12px;font-style:italic}
svg text{font-family:Marianne,Arial,sans-serif}
dl.lire{display:grid;grid-template-columns:minmax(0,15rem) 1fr;gap:6px 16px;font-size:13px}
dl.lire dt{font-weight:700} dl.lire dd{margin:0;color:#333}
@media (max-width:600px){ dl.lire{grid-template-columns:1fr} .row{grid-template-columns:minmax(0,8rem) 1fr max-content} }
</style>
</head>
<body>
<header>
  <h1>BASAVI : mettre en relation les femmes avec une association</h1>
  <p>Annuaire des associations d'aide aux femmes victimes de violences.</p>
</header>
<div class="tb" id="filters">
  <label>Période <select id="f-per">
    <option value="ouverture">Depuis l'ouverture (01/10)</option>
    <option value="7">7 derniers jours</option>
    <option value="30">30 derniers jours</option>
    <option value="perso">Personnalisé</option>
  </select></label>
  <label>Du <input type="date" id="f-du"></label>
  <label>au <input type="date" id="f-au"></label>
  <span style="display:flex;gap:6px;align-items:center;color:#444">Appareil
    <span class="seg" id="f-dev" role="group" aria-label="Appareil">
      <button data-d="tous" aria-pressed="true">Tous</button><button data-d="mobile" aria-pressed="false">Mobile</button><button data-d="desktop" aria-pressed="false">Ordinateur</button>
    </span></span>
</div>
<div class="src" id="f-src"></div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="main"><p class="empty">Chargement des données…</p></main>
<script>
const TABS = [['synthese', 'Synthèse'], ['utilisable', 'Utilisable'], ['utilise', 'Utilisé'], ['utile', 'Utile'], ['impactant', 'Impactant'], ['lire', 'Comment lire']];
const OUVERTURE = '2026-10-01';   // ouverture publique retenue par Ali : rien n'est compté ni comparé avant
const DEV = { tous: 'tous appareils', mobile: 'mobile', desktop: 'ordinateur' };
const MODES = [['saisie', 'Saisie manuelle'], ['ville', 'Lien ville'], ['carte', 'Carte'], ['geoloc', 'Géolocalisation']];
const FILTRE = { 'violences-conjugales': 'Violence au sein du couple', 'violences-sexuelles': 'Viol, agression sexuelle', 'mutilations-sexuelles': 'Excision, mutilations', prostitution: 'Prostitution', 'mariages-forces': 'Mariage forcé', 'harcelement-sexuel': 'Harcèlement, agression au travail' };
const CANAL = { clic_site: 'Site de l’association', clic_email: 'E-mail', copie_adresse: 'Copie d’adresse', clic_telephone: 'Téléphone' };
const URGENCE = { 3919: '3919', 17: '17', 112: '112', 114: '114 (SMS)', autre: 'Autre' };
const PETIT = 10;   // règle des petits effectifs : sous 10, effectif seul
const S = { tab: 'synthese', dev: 'tous', per: 'ouverture', du: null, au: null };
let D = null;

// ---------- formatage ----------
const nf = new Intl.NumberFormat('fr-FR');
const int = (n) => n == null ? '–' : nf.format(Math.round(n));
const pct = (x) => (x == null || !isFinite(x)) ? '–' : (Math.round(x * 1000) / 10).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
const valPart = (n, base) => (base && n != null) ? `${pct(n / base)}<span class="nb">${int(n)}</span>` : '–';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tip = (label, def) => `<span class="tip" title="${esc(def)}">${label}</span>`;
const sansComp = () => `<span class="tip" title="${esc(D.prev ? '' : 'Pas de période précédente comparable : elle tomberait avant l’ouverture du 01/10.')}">–</span>`;
const trendPts = (a, b) => (a == null || b == null) ? sansComp() : (() => { const d = Math.round((a - b) * 1000) / 10; return `${d > 0 ? '▲ +' : d < 0 ? '▼ ' : '= '}${d.toLocaleString('fr-FR')} pts`; })();
const trendN = (a, b) => (a == null || b == null) ? sansComp() : (() => { const d = a - b; return `${d > 0 ? '▲ +' : d < 0 ? '▼ ' : '= '}${int(d)}`; })();
const jm = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
const plage = (j) => j && j.length ? (j.length === 1 ? `le ${jm(j[0])}` : `du ${jm(j[0])} au ${jm(j[j.length - 1])}`) : '–';
const ajoute = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const jours = (a, b) => { const out = []; for (let d = a; d <= b; d = ajoute(d, 1)) out.push(d); return out; };

// ---------- données ----------
const cols2rows = (t) => { const k = Object.keys(t).filter((c) => c !== 'manualSort'); return (t.id || []).map((_, i) => Object.fromEntries(k.map((c) => [c, t[c][i]]))); };
async function load() {
  if (window.self !== window.top && window.grist && grist.docApi) {
    grist.ready({ requiredAccess: 'read table' });
    // Extractions est un bandeau de fraîcheur : son absence ne doit pas vider la page.
    const [s, e, m, x] = await Promise.all([...['Sessions', 'Events', 'Modes'].map((t) => grist.docApi.fetchTable(t)), grist.docApi.fetchTable('Extractions').catch(() => null)]);
    const ex = x ? cols2rows(x) : [];
    return { sess: cols2rows(s), evt: cols2rows(e), modes: cols2rows(m), meta: ex[ex.length - 1] || null };
  }
  return window.BASAVI_DATA;
}

// ---------- période unique : chiffres, tableaux et courbes suivent le même choix ----------
// Dernier jour complet : le jour de l'extraction n'est que partiellement collecté (passage à 6h).
function bornes() {
  const tous = [...new Set(D.sess.map((r) => r.day))].sort();
  const ext = (D.meta?.extracted_at || '').slice(0, 10);
  const complets = tous.filter((d) => d >= OUVERTURE && (!ext || d < ext));
  return { min: OUVERTURE, max: complets[complets.length - 1] || tous[tous.length - 1] };
}
function appliquerPreset() {
  const b = bornes();
  if (S.per === 'perso') return;
  S.au = b.max;
  S.du = S.per === 'ouverture' ? b.min : (() => { const d = ajoute(b.max, 1 - Number(S.per)); return d < b.min ? b.min : d; })();
}
function fenetres() {
  const f = jours(S.du, S.au), n = f.length;
  const pDu = ajoute(S.du, -n), pAu = ajoute(S.du, -1);
  return { f, p: pDu >= OUVERTURE ? jours(pDu, pAu) : null };
}

// ---------- calculs (mêmes tables que la page « Tableau ») ----------
const somme = (arr, k) => arr.reduce((a, r) => a + (Number(r[k]) || 0), 0);
// Colonne Grist du nombre de sessions ayant appliqué un type de filtre (cf. etl.mjs).
const colFiltre = (t) => `s_f_${t.replace(/-/g, '_')}`;
function mesures(f, dev = S.dev) {
  if (!f) return null;
  const inF = (r) => f.includes(r.day) && r.device === dev;
  const SS = D.sess.filter(inF), EV = D.evt.filter(inF), MO = D.modes.filter(inF);
  const ev = (cat, act, nom) => EV.filter((e) => e.category === cat && (!act || e.action === act) && (nom == null || e.name === nom)).reduce((a, e) => a + (Number(e.count) || 0), 0);
  const V = somme(SS, 'visites');
  // Compteur V1.2 lu seulement si TOUTES les lignes de la fenêtre ont été écrites par l'ETL
  // V1.2 (schema_v ≥ 12) : une colonne absente, ajoutée mais pas encore remplie (0 par défaut
  // dans Grist), ou remplie sur une partie des jours, donne « non mesuré », jamais un chiffre.
  const v12 = SS.length > 0 && SS.every((r) => Number(r.schema_v) >= 12);
  const opt = (c) => v12 && SS.every((r) => r[c] != null) ? somme(SS, c) : null;
  const modes = Object.fromEntries(MODES.map(([k]) => { const r = MO.filter((x) => x.mode === k); return [k, { arr: somme(r, 's_arrivee'), res: somme(r, 's_resultats'), cont: somme(r, 's_contact') }]; }));
  const arrTot = MODES.reduce((a, [k]) => a + modes[k].arr, 0), contModes = MODES.reduce((a, [k]) => a + modes[k].cont, 0);
  // act : une action, une liste d'actions, ou null pour toutes.
  const grouper = (cat, act, cle, lbl) => { const g = Object.create(null); for (const e of EV.filter((x) => x.category === cat && (!act || (Array.isArray(act) ? act.includes(x.action) : x.action === act)))) { const k = e[cle] || ''; g[k] = (g[k] || 0) + (Number(e.count) || 0); } return Object.entries(g).map(([k, x]) => ({ n: (lbl && Object.hasOwn(lbl, k)) ? lbl[k] : (k || 'Non précisé'), x })).sort((a, b) => b.x - a.x); };
  return {
    f, V, mesure: SS.length > 0,
    rech: somme(SS, 's_recherche'), res: somme(SS, 's_resultats'), cont: somme(SS, 's_contact'), tel: somme(SS, 's_tel'), copie: somme(SS, 's_copie'),
    multi: opt('s_rech_multi'), filtre: opt('s_filtre'), rechSansFiltre: opt('s_rech_sans_filtre'),
    email: opt('s_email'), site: opt('s_site'), sessErr: opt('s_erreur'),
    sortUrg: opt('s_sortie_urgence'), sortAlv: opt('s_sortie_alv'),
    filtresSess: Object.keys(FILTRE).map((k) => ({ n: FILTRE[k], x: opt(colFiltre(k)) })).filter((i) => i.x != null).sort((a, b) => b.x - a.x),
    recherches: ev('recherche', 'lancer'), e404: ev('erreur', '404'), e500: ev('erreur', '500'), clusters: ev('recherche', 'ouvrir_cluster'),
    geoLance: ev('recherche', 'lancer', 'geoloc'), geoEchec: ev('recherche', 'geoloc_echec'), geoOk: ev('recherche', 'geoloc_reussite'),
    urgences: grouper('aide', ['clic_telephone', 'clic_sms'], 'name', URGENCE),
    modes, sansRech: { arr: Math.max(0, V - arrTot), cont: Math.max(0, somme(SS, 's_contact') - contModes) },
    canaux: grouper('contact', null, 'action', CANAL), filtres: grouper('recherche', 'filtrer', 'name', FILTRE),
  };
}
// Un tag récent n'a pas d'historique : avant son premier event, « 0 » serait faux.
// La mesure démarre au premier jour où l'event apparaît, tous appareils confondus.
// Le tracker est public : un hit forgé ou un essai avant la recette ne doit pas ouvrir la
// mesure plus tôt. Plancher = recette du tag en préprod (30/10/2026), et seules les actions
// du plan de tag comptent.
const TAG_V12 = '2026-10-30';
function debutMesure(test) { const j = D.evt.filter((e) => e.day && e.day >= TAG_V12 && test(e)).map((e) => e.day).sort(); return j[0] || null; }
const DEBUT_SORTIES = (e) => (e.category === 'aide' && (e.action === 'clic_telephone' || e.action === 'clic_sms')) || (e.category === 'navigation' && e.action === 'retour_alv');
const DEBUT_GEOLOC = (e) => e.category === 'recherche' && (e.action === 'geoloc_echec' || e.action === 'geoloc_reussite');
function depuis(f, test) { const d = debutMesure(test); if (!d) return null; const g = f.filter((x) => x >= d); return g.length ? { f: g, d, partiel: g.length < f.length } : null; }
const err = (M) => M.e404 + M.e500;
const taux = (n, V) => (V && n != null) ? n / V : null;
// série journalière pour la fenêtre : un jour sans collecte reste un trou
const serieJour = (f, fn) => f.map((d) => { const x = mesures([d]); return { d, v: x.mesure ? fn(x) : null }; });

// ---------- graphiques ----------
const largeur = (part = 1) => Math.round(Math.max(300, ((document.getElementById('main').clientWidth || 1200) - 32) * part - (part < 1 ? 40 : 0)));
function courbe(points, fmt, part = 1, barresMode = false) {
  const W = largeur(part), H = 180, L = 30, R = 30, T = 22, B = 26;
  const vals = points.map((p) => p.v).filter((v) => v != null);
  if (!vals.length) return '<p class="empty">Pas de donnée sur la période.</p>';
  const max = Math.max(...vals) * 1.2 || 1, n = points.length;
  const x = (i) => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const pas = Math.max(1, Math.ceil(n / Math.max(4, Math.floor((W - L - R) / 70))));
  const etiq = (i) => n <= 10 || i === n - 1 || i % pas === 0;
  let g = '';
  for (let k = 0; k <= 2; k++) { const v = max * k / 2; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ececec"/>`; }
  let corps = '';
  if (barresMode) {
    const bw = Math.max(2, Math.min(18, (W - L - R) / n * 0.6));
    corps = points.map((p, i) => p.v == null ? '' : `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(p.v)).toFixed(1)}" fill="#000091" opacity=".85"/>${p.v && etiq(i) ? `<text x="${x(i)}" y="${y(p.v) - 5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#000091">${fmt(p.v)}</text>` : ''}`).join('');
  } else {
    let seg = [];
    const flush = () => { if (seg.length > 1) corps += `<polyline points="${seg.join(' ')}" fill="none" stroke="#000091" stroke-width="2"/>`; seg = []; };
    points.forEach((p, i) => { if (p.v == null) flush(); else seg.push(`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`); });
    flush();
    corps += points.map((p, i) => p.v == null ? '' : `<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="#000091"/>${etiq(i) ? `<text x="${x(i)}" y="${y(p.v) - 8}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#000091">${fmt(p.v)}</text>` : ''}`).join('');
  }
  const labels = points.map((p, i) => etiq(i) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#8a8a9a">${jm(p.d)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Évolution par jour">${g}${corps}${labels}</svg>`;
}
function barresErreurs(f) {
  const pts = f.map((d) => { const x = mesures([d]); return { d, a: x.mesure ? x.e404 : null, b: x.mesure ? x.e500 : null }; });
  const tot = pts.map((p) => (p.a || 0) + (p.b || 0));
  if (!pts.some((p) => p.a != null) || !Math.max(...tot)) return '<p class="empty">Aucune erreur sur la période.</p>';
  const W = largeur(0.5), H = 180, L = 30, R = 30, T = 22, B = 26, n = pts.length, max = Math.max(...tot) * 1.2;
  const x = (i) => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), y = (v) => T + (H - T - B) * (1 - v / max), h = (v) => (H - T - B) * v / max;
  const bw = Math.max(2, Math.min(18, (W - L - R) / n * 0.6)), pas = Math.max(1, Math.ceil(n / Math.max(4, Math.floor((W - L - R) / 70))));
  let g = ''; for (let k = 0; k <= 2; k++) { const v = max * k / 2; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ececec"/>`; }
  const barres = pts.map((p, i) => { const a = p.a || 0, b = p.b || 0; if (!a && !b) return ''; const x0 = (x(i) - bw / 2).toFixed(1);
    return `<rect x="${x0}" y="${y(b).toFixed(1)}" width="${bw.toFixed(1)}" height="${h(b).toFixed(1)}" fill="#000091"/><rect x="${x0}" y="${y(a + b).toFixed(1)}" width="${bw.toFixed(1)}" height="${h(a).toFixed(1)}" fill="#8585f6"/><text x="${x(i)}" y="${y(a + b) - 5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#000091">${int(a + b)}</text>`; }).join('');
  const labels = pts.map((p, i) => (n <= 10 || i === n - 1 || i % pas === 0) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#8a8a9a">${jm(p.d)}</text>` : '').join('');
  const leg = `<div class="note" style="display:flex;gap:14px"><span><span style="display:inline-block;width:10px;height:10px;background:#000091;vertical-align:-1px"></span> erreurs 500</span><span><span style="display:inline-block;width:10px;height:10px;background:#8585f6;vertical-align:-1px"></span> erreurs 404</span></div>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Erreurs 404 et 500 par jour">${g}${barres}${labels}</svg>${leg}`;
}
const pctCourt = (v) => (Math.round(v * 100)).toLocaleString('fr-FR') + ' %';
function barres(items, base, opts = {}) {
  if (!items.length || !base) return '<p class="empty">Aucune donnée sur la période.</p>';
  const mx = Math.max(...items.map((i) => i.x)) || 1;
  return `<div class="rows">${items.map((i) => `<div class="row${i.gris ? ' gris' : ''}${i.sub ? ' sub' : ''}"><span class="n" title="${esc(i.n)}">${i.tip ? tip(esc(i.n), i.tip) : esc(i.n)}</span><span class="t"><span class="f" style="width:${(100 * i.x / (opts.echelle || mx)).toFixed(1)}%"></span></span><span class="v">${valPart(i.x, base)}</span></div>`).join('')}</div>`;
}
const intro = (txt) => `<p class="intro">${txt}</p>`;
const SANS_RECH = 'Sessions sans recherche lancée : visiteuses reparties sans chercher, et arrivées directes sur une page de résultats (lien depuis Google ou ALV, onglet resté ouvert).';
const PAS_ENCORE = (quoi) => `<p class="pend">${quoi} : aucun event reçu sur la période. La mesure démarre à la mise en production du tag.</p>`;
const depuisTxt = (x) => x.partiel ? ` <small>: mesuré depuis le ${jm(x.d)}</small>` : '';

// ---------- onglets ----------
const partErr = (M) => taux(M.sessErr, M.V);
function synthese(M, P) {
  const vs = P ? `<div class="c">vs ${plage(P.f)}</div>` : '';
  return `
  <h2>Indicateurs principaux <small>: ${plage(M.f)}, ${DEV[S.dev]}</small></h2>
  <div class="tiles">
    <div class="tile"><div class="pil">Utilisable</div><div class="lab">${tip('Sessions touchées par une erreur', 'Part des sessions qui affichent au moins une page 404 ou 500.')}</div><div class="v">${M.mesure ? pct(partErr(M)) : '–'}<span class="nb">${M.mesure ? int(M.sessErr) : ''}</span></div><div class="c">${M.mesure ? `${int(err(M))} erreurs sur la période` : ''}</div><div class="trend">${P ? trendPts(partErr(M), partErr(P)) : sansComp()}</div>${vs}</div>
    <div class="tile"><div class="pil">Utilisé</div><div class="lab">${tip('Sessions qui lancent une recherche', 'Part des sessions qui lancent au moins une recherche.')}</div><div class="v">${pct(taux(M.rech, M.V))}<span class="nb">${M.V ? int(M.rech) : ''}</span></div><div class="c">sur ${int(M.V)} sessions</div><div class="trend">${P ? trendPts(taux(M.rech, M.V), taux(P.rech, P.V)) : sansComp()}</div>${vs}</div>
    <div class="tile"><div class="pil">Utile</div><div class="lab">${tip('Mise en relation', 'Part des sessions avec au moins un contact vers une association : téléphone, e-mail, site ou copie de l’adresse.')}</div><div class="v">${pct(taux(M.cont, M.V))}<span class="nb">${M.V ? int(M.cont) : ''}</span></div><div class="c">sur ${int(M.V)} sessions</div><div class="trend">${P ? trendPts(taux(M.cont, M.V), taux(P.cont, P.V)) : sansComp()}</div>${vs}</div>
    <div class="tile wait"><div class="pil">Impactant</div><div class="lab">Femmes accompagnées par une association</div><div class="v">${tip('Non mesuré à ce jour', 'Source externe à Matomo à identifier : la suite du contact se joue hors du site.')}</div></div>
  </div>
  <h2>${tip('Parcours jusqu’au contact', 'Toutes les étapes sont comptées en sessions. Une session peut lancer plusieurs recherches.')} <small>: en sessions, ${plage(M.f)}</small></h2>
  ${barres([{ n: 'Arrivée sur l’annuaire', x: M.V }, { n: 'Résultats vus', x: M.res, tip: 'Sessions qui voient une liste de résultats ou la carte.' }, { n: 'après 1 recherche', x: M.multi == null ? null : Math.max(0, M.rech - M.multi), sub: true }, { n: 'après plusieurs', x: M.multi, sub: true, tip: 'Sessions qui lancent au moins deux recherches : la femme reformule ou change de ville.' }, { n: 'sans recherche lancée', x: Math.max(0, M.res - M.rech), sub: true, gris: true, tip: 'Arrivée directe sur une page de résultats (lien depuis Google ou ALV, onglet resté ouvert) ou carte ouverte sans recherche.' }, { n: 'Contact avec une association', x: M.cont }], M.V, { echelle: M.V })}
  <p class="note">${M.rech ? `${int(M.recherches)} recherches lancées par ${int(M.rech)} sessions, soit ${(Math.round(10 * M.recherches / M.rech) / 10).toLocaleString('fr-FR')} recherche par session qui cherche.` : ''}</p>`;
}
function geoloc(f) {
  const x = depuis(f, DEBUT_GEOLOC);
  const h = `<h2>${tip('Échec de la géolocalisation', 'Part des tentatives de géolocalisation qui échouent : refus de l’autorisation, position indisponible ou délai dépassé.')}${x ? depuisTxt(x) : ''}</h2>`;
  if (!x) return h + PAS_ENCORE('Échecs de la géolocalisation');
  const G = mesures(x.f), base = G.geoEchec + G.geoOk;
  return h + `<div class="kv"><div><div class="big">${base ? pct(G.geoEchec / base) : '–'}<span class="nb">${int(G.geoEchec)} sur ${int(base)} tentatives</span></div><div class="hint">géolocalisations qui échouent</div></div></div>`;
}
function utilisable(M, P) {
  const lignes = [{ n: 'Sans recherche', x: M.sansRech.arr, gris: true, tip: SANS_RECH }, ...MODES.map(([k, l]) => ({ n: l, x: M.modes[k].arr }))];
  return `
  ${intro('<b>Utilisable</b> : comment la recherche démarre, et la fiabilité technique de l’annuaire.')}
  <h2>${tip('Mode d’entrée', 'Chaque session compte une seule fois, dans le mode de sa première recherche. Les sessions sans recherche complètent le total.')} <small>: une session = son premier mode, ${DEV[S.dev]}</small></h2>
  ${barres(lignes, M.V, { echelle: M.V })}
  <p class="note">Total : ${int(M.V)} sessions.</p>
  ${geoloc(M.f)}
  <h2>${tip('Sessions touchées par une erreur', 'Part des sessions qui affichent au moins une page 404 ou 500.')} <small>: ${plage(M.f)}</small></h2>
  <div class="grid2">
    <div class="box"><div class="kv"><div><div class="big">${M.mesure ? pct(partErr(M)) : '–'}<span class="nb">${M.mesure ? `${int(M.sessErr)} sessions` : ''}</span></div><div class="hint">sessions touchées</div></div><div><div class="big">${M.mesure ? int(M.e404) : '–'}</div><div class="hint">erreurs 404</div></div><div><div class="big">${M.mesure ? int(M.e500) : '–'}</div><div class="hint">erreurs 500</div></div></div>
      <div class="trend">${P ? trendPts(partErr(M), partErr(P)) : sansComp()}</div></div>
    <div class="box"><h3>Erreurs par jour <small>: 404 et 500</small></h3>${barresErreurs(M.f)}</div>
  </div>`;
}
function utilise(M, P) {
  // Trois segments qui partitionnent les sessions : le complément est celui de la tuile recherche.
  const avecF = M.rechSansFiltre == null ? null : Math.max(0, M.rech - M.rechSansFiltre), sansR = Math.max(0, M.V - M.rech);
  const pv = (n) => M.V ? (100 * n / M.V).toFixed(1) : 0;
  return `
  ${intro('<b>Utilisé</b> : l’usage réel de l’annuaire, lancement de recherches et besoins exprimés par les filtres.')}
  <h2>${tip('Sessions qui lancent une recherche', 'Part des sessions qui lancent au moins une recherche.')} <small>: ${DEV[S.dev]}</small></h2>
  <div class="kv"><div><div class="big">${pct(taux(M.rech, M.V))}<span class="nb">${M.V ? int(M.rech) : ''}</span></div><div class="hint">sur ${int(M.V)} sessions</div></div><div class="trend">${P ? trendPts(taux(M.rech, M.V), taux(P.rech, P.V)) : sansComp()}</div></div>
  ${courbe(serieJour(M.f, (x) => taux(x.rech, x.V)), pctCourt)}
  <h2>${tip('Usage des filtres', 'Répartition de toutes les sessions : celles qui cherchent et appliquent au moins un filtre, celles qui cherchent sans filtrer, celles qui ne lancent pas de recherche.')} <small>: part des ${int(M.V)} sessions</small></h2>
  ${M.V && avecF != null ? `<div class="stack" role="img" aria-label="Usage des filtres"><span style="width:${pv(avecF)}%;background:var(--bf)"></span><span style="width:${pv(M.rechSansFiltre)}%;background:#6a6af4"></span><span style="width:${pv(sansR)}%;background:#d6d6e6"></span></div>
  <div class="lg"><span><i style="background:var(--bf)"></i><b>Cherchent et filtrent</b> ${valPart(avecF, M.V)}</span><span><i style="background:#6a6af4"></i>Cherchent sans filtrer ${valPart(M.rechSansFiltre, M.V)}</span><span><i style="background:#d6d6e6"></i>Ne cherchent pas ${valPart(sansR, M.V)}</span></div>
  <div class="kv" style="margin-top:10px"><div><div class="big">${pct(taux(M.rechSansFiltre, M.rech))}<span class="nb">${int(M.rechSansFiltre)} sur ${int(M.rech)}</span></div><div class="hint">${tip('des sessions qui cherchent ne filtrent pas', 'Part des sessions qui lancent une recherche sans jamais appliquer de filtre.')}</div></div></div>` : '<p class="empty">Aucune donnée sur la période.</p>'}
  <div class="grid2" style="margin-top:14px">
    <div class="box"><h3>${tip('Filtres appliqués', 'Part des sessions qui filtrent ayant appliqué ce type. Une session peut en appliquer plusieurs : le total dépasse 100 %.')} <small>: parmi les ${int(M.filtre)} sessions qui appliquent un filtre, avec ou sans recherche</small></h3>
      ${!M.mesure ? '<p class="empty">Aucune donnée sur la période.</p>' : M.filtre == null ? '<p class="empty">Collecte V1.2 pas encore passée sur la période.</p>' : barres(M.filtresSess.filter((i) => i.x > 0), M.filtre)}</div>
    <div class="box"><h3>${tip('Recherches lancées', 'Nombre de recherches, toutes sessions confondues : une session peut en lancer plusieurs.')} <small>: ${plage(M.f)}</small></h3>
      <div class="kv"><div><div class="big">${int(M.recherches)}</div><div class="hint">recherches, par ${int(M.rech)} sessions</div></div><div class="trend">${P ? trendN(M.recherches, P.recherches) : sansComp()}</div></div>
      ${courbe(serieJour(M.f, (x) => x.recherches), int, 0.5, true)}</div>
  </div>`;
}
function sorties(f) {
  const x = depuis(f, DEBUT_SORTIES), X = x && mesures(x.f);
  const h = `<h2>${tip('Portes de sortie', 'Chaque session compte dans une seule sortie, la première atteinte dans cet ordre : contact avec une association, numéro d’urgence, retour vers ALV.')} <small>: en sessions</small>${x ? depuisTxt(x) : ''}</h2>`;
  if (!x) return h + PAS_ENCORE('Numéros d’urgence et retour vers ALV');
  if (X.sortUrg == null || X.sortAlv == null) return h + '<p class="pend">Des clics sont reçus, mais la collecte V1.2 n’est pas encore passée sur tous les jours de la période.</p>';
  const O = X, sans = Math.max(0, O.V - O.cont - O.sortUrg - O.sortAlv), totU = O.urgences.reduce((a, i) => a + i.x, 0);
  return h + barres([{ n: 'Contact avec une association', x: O.cont }, { n: 'Numéro d’urgence', x: O.sortUrg, tip: 'Clic sur le 3919, le 17, le 112 ou le 114, sans contact avec une association.' }, { n: 'Retour vers ALV', x: O.sortAlv, tip: 'Clic sur le lien vers arretonslesviolences.gouv.fr, sans contact ni numéro d’urgence.' }, { n: 'Sans sortie identifiée', x: sans, gris: true, tip: 'Session sans contact, sans numéro d’urgence et sans retour vers ALV.' }], O.V, { echelle: O.V })
    + `<div class="box" style="margin-top:12px"><h3>Numéros d’urgence <small>: ${int(totU)} clics</small></h3>${barres(O.urgences, totU)}</div>`;
}
function utile(M, P) {
  const cell = (n, base) => base ? `${pct(n / base)}<span class="nb">${int(n)}</span>` : '–';
  const conv = (c, a) => !a ? '–' : (a < PETIT || c < PETIT) && c !== 0 ? tip(`${int(c)} sur ${int(a)}`, 'Petit effectif (moins de 10) : le pourcentage n’est pas affiché, il varierait trop d’une période à l’autre.') : pct(c / a);
  const ligne = (lbl, a, c, gris) => `<tr${gris ? ' class="gris"' : ''}><td>${lbl}</td><td class="r">${cell(a, M.V)}</td><td class="r">${cell(c, M.V)}</td><td class="r"><b>${conv(c, a)}</b></td></tr>`;
  const ca = M.modes.carte;
  const canaux = [{ n: CANAL.clic_site, x: M.site }, { n: CANAL.clic_email, x: M.email }, { n: CANAL.copie_adresse, x: M.copie }, { n: CANAL.clic_telephone, x: M.tel }].sort((a, b) => b.x - a.x);
  return `
  ${intro('<b>Utile</b> : la mise en relation, c’est-à-dire la part des sessions qui aboutissent à un contact avec une association.')}
  <h2>${tip('Mise en relation', 'Part des sessions avec au moins un contact : téléphone, e-mail, site ou copie de l’adresse.')} <small>: ${DEV[S.dev]}</small></h2>
  <div class="kv"><div><div class="big">${pct(taux(M.cont, M.V))}<span class="nb">${M.V ? int(M.cont) : ''}</span></div><div class="hint">sur ${int(M.V)} sessions</div></div><div class="trend">${P ? trendPts(taux(M.cont, M.V), taux(P.cont, P.V)) : sansComp()}</div></div>
  ${courbe(serieJour(M.f, (x) => taux(x.cont, x.V)), pctCourt)}
  ${sorties(M.f)}
  <h2>${tip('Contact par canal', 'Part des sessions qui utilisent ce canal. Une session peut en utiliser plusieurs : la somme dépasse la mise en relation.')} <small>: part des ${int(M.V)} sessions</small></h2>
  ${barres(canaux, M.V)}
  <h2>${tip('Du mode d’entrée au contact', 'Entrée et contact en part de toutes les sessions de la période ; conversion = contacts ÷ entrées du mode.')} <small>: en part des ${int(M.V)} sessions</small></h2>
  <table class="tbl"><thead><tr><th>Mode</th><th class="r">Entrée</th><th class="r">Contact</th><th class="r">Conversion</th></tr></thead><tbody>
    ${ligne('Saisie manuelle', M.modes.saisie.arr, M.modes.saisie.cont)}
    ${ligne('Lien ville', M.modes.ville.arr, M.modes.ville.cont)}
    ${ligne('Géolocalisation', M.modes.geoloc.arr, M.modes.geoloc.cont)}
    ${ligne(`Carte <span style="color:var(--mut)">(fiche consultée : ${int(ca.res)})</span>`, ca.arr, ca.cont)}
    ${ligne(tip('Sans recherche', SANS_RECH), M.sansRech.arr, M.sansRech.cont, true)}
    <tr class="tot"><td>Total</td><td class="r">${cell(M.V, M.V)}</td><td class="r">${cell(M.cont, M.V)}</td><td class="r">${pct(taux(M.cont, M.V))}</td></tr>
  </tbody></table>`;
}
function impactant() {
  return `
  ${intro('<b>Impactant</b> : l’accompagnement effectif des femmes par une association après le contact.')}
  <div class="tiles" style="margin-top:16px"><div class="tile wait"><div class="pil">Impactant</div><div class="lab">Femmes accompagnées par au moins une association</div><div class="v">Non mesuré à ce jour</div><div class="c">Matomo s’arrête au clic de contact : la suite se joue hors du site. Une source externe est à identifier avec les associations.</div></div></div>`;
}
const lire = () => `<h2>Définitions</h2><dl class="lire">
  <dt>Session</dt><dd>Une visite sur l’annuaire. Toutes les parts du tableau sont en sessions, sauf mention contraire.</dd>
  <dt>Recherche</dt><dd>Un lancement de recherche. Une session peut en lancer plusieurs : les recherches ne se comparent pas aux sessions.</dd>
  <dt>Mise en relation</dt><dd>Session avec au moins un contact vers une association : clic téléphone, e-mail, site ou copie de l’adresse.</dd>
  <dt>Mode d’entrée</dt><dd>Saisie manuelle, lien ville, géolocalisation ou carte ouverte avant toute recherche. Une session compte dans le mode de sa première recherche.</dd>
  <dt>Sans recherche</dt><dd>${SANS_RECH}</dd>
  <dt>Sessions touchées par une erreur</dt><dd>Sessions qui affichent au moins une page 404 ou 500.</dd>
  <dt>Portes de sortie</dt><dd>Chaque session compte dans une seule sortie, dans cet ordre : contact avec une association, numéro d’urgence (3919, 17, 112, 114), retour vers ALV. Le reste est « sans sortie identifiée ».</dd>
  <dt>Usage des filtres</dt><dd>Les sessions se partagent en trois : celles qui cherchent et appliquent au moins un filtre de type de violence, celles qui cherchent sans filtrer, celles qui ne lancent pas de recherche. Le détail par type se lit parmi toutes les sessions qui appliquent un filtre, avec ou sans recherche lancée.</dd>
  <dt>Échec de la géolocalisation</dt><dd>Tentatives de géolocalisation qui échouent (réussites et échecs à la base), refus et panne confondus.</dd>
  <dt>Petits effectifs</dt><dd>Sous 10, une conversion s’affiche en effectifs (« 5 sur 48 ») plutôt qu’en pourcentage.</dd></dl>
  <h2>Période et comparaison</h2><dl class="lire">
  <dt>Ouverture</dt><dd>Le tableau démarre au 01/10, date d’ouverture publique. Les visites de test d’avant ne sont pas comptées.</dd>
  <dt>Comparaison</dt><dd>Avec la période de même durée juste avant (7 jours contre les 7 jours précédents). Si elle tombe avant le 01/10, pas d’évolution : un tiret.</dd>
  <dt>Dernier jour</dt><dd>La collecte passe chaque nuit à 6h : le jour en cours n’est pas affiché par défaut.</dd></dl>
  <h2>En attente</h2><dl class="lire">
  <dt>Part des visiteurs d’ALV</dt><dd>En stand-by : demande le total des visiteurs d’arretonslesviolences.gouv.fr (API Eulerian). Le bouton d’origine sur ALV sera mesurable avec des liens de campagne.</dd>
  <dt>Nouvelles mesures</dt><dd>Numéros d’urgence, retour vers ALV et échec de la géolocalisation démarrent à la mise en production de leur tag : avant, un tiret.</dd>
  <dt>Impactant</dt><dd>Femmes accompagnées par une association : source externe à identifier.</dd></dl>
  <p class="note">Source : Matomo de l’annuaire (annuaire.arretonslesviolences.gouv.fr en production), agrégats par jour et par appareil. Aucune donnée individuelle.</p>`;

// ---------- rendu ----------
function render() {
  const b = bornes();
  const du = document.getElementById('f-du'), au = document.getElementById('f-au');
  du.min = au.min = b.min; du.max = au.max = b.max; du.value = S.du; au.value = S.au;
  document.getElementById('f-per').value = S.per;
  document.querySelectorAll('#f-dev button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.d === S.dev)));
  const { f, p } = fenetres();
  D.prev = p;
  const ext = D.meta?.extracted_at ? new Date(D.meta.extracted_at).toLocaleDateString('fr-FR') : '';
  document.getElementById('f-src').innerHTML = `<b>${esc(D.meta?.source || 'Matomo')}</b> · ${plage(f)} · ${f.length} jour${f.length > 1 ? 's' : ''} · ${p ? 'comparé ' + plage(p) : 'sans comparaison'}${ext ? ' · extraction du ' + ext : ''}`;
  document.getElementById('tabs').innerHTML = TABS.map(([id, l]) => `<button role="tab" aria-selected="${S.tab === id}" data-t="${id}">${l}</button>`).join('');
  const M = mesures(f), P = p ? mesures(p) : null;
  try {
    document.getElementById('main').innerHTML = { synthese: () => synthese(M, P), utilisable: () => utilisable(M, P), utilise: () => utilise(M, P), utile: () => utile(M, P), impactant, lire }[S.tab]();
  } catch (e) { console.error(e); document.getElementById('main').innerHTML = `<p class="empty">Le tableau n’a pas pu être affiché : ${esc(e.message)}</p>`; }
}
let attente; window.addEventListener('resize', () => { clearTimeout(attente); attente = setTimeout(() => D && render(), 150); });
document.getElementById('tabs').addEventListener('click', (e) => { const x = e.target.closest('button[data-t]'); if (x) { S.tab = x.dataset.t; render(); } });
document.getElementById('f-dev').addEventListener('click', (e) => { const x = e.target.closest('button[data-d]'); if (x) { S.dev = x.dataset.d; render(); } });
document.getElementById('filters').addEventListener('change', (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === 'f-per') { S.per = v; appliquerPreset(); }
  if ((id === 'f-du' || id === 'f-au') && v) { S.per = 'perso'; const b = bornes(); const c = v < b.min ? b.min : v > b.max ? b.max : v; if (id === 'f-du') S.du = c; else S.au = c; if (S.du > S.au) { const t = S.du; S.du = S.au; S.au = t; } }
  render();
});
function demarrer(d) { D = d; D.sess ||= []; D.evt ||= []; D.modes ||= []; appliquerPreset(); render(); }
load().then((d) => {
  if (!d) { document.getElementById('main').innerHTML = '<p class="empty">Hors Grist : aucune donnée.</p>'; return; }
  demarrer(d);
  if (window.grist && grist.onRecords) grist.onRecords(async () => { const n = await load(); if (n) { D = n; render(); } });
}).catch((e) => { document.getElementById('main').innerHTML = `<p class="empty">Données indisponibles : ${esc(e.message)}</p>`; });
</script>
</body>
</html>
