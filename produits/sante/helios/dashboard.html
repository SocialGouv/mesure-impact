<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELIOS · Adoption (source Grist)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<!-- API widget Grist : donne window.grist quand la page est embarquée dans un doc Grist (sinon absente → fallback snapshot) -->
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif;color:#161616}
  .subtabs{display:flex;gap:.3rem;border-bottom:2px solid #000091;padding:.6rem 1rem 0}
  .subtab{border:0;background:#eee;padding:.5rem 1rem;border-radius:6px 6px 0 0;cursor:pointer;font-weight:600;font-size:.9rem}
  .subtab.active{background:#000091;color:#fff}
  .panel{display:none;padding:1.2rem}
  .panel.active{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1rem}
  .card{border:1px solid #ddd;border-radius:8px;padding:1rem;background:#fff}
  .card .lbl{font-size:.82rem;color:#666}
  .card .big{font-size:2rem;font-weight:700;color:#000091;margin:.2rem 0;line-height:1.1}
  .card .sub{font-size:.78rem;color:#666}
  .card .delta{font-size:.78rem;color:#3a3a3a;margin-top:.15rem}
  .card svg{display:block;margin-top:.5rem}
  h2{font-size:1.05rem;color:#000091;margin:1.3rem 0 .5rem}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid #eee}
  th{color:#666;font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:#999;font-size:.82rem}
  .toolbar{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;background:#f5f5fe;border-bottom:1px solid #ddd}
  .toolbar label{font-size:.8rem;color:#161616;font-weight:700}
  .toolbar select{padding:.4rem .6rem;border-radius:4px;border:1px solid #000091;background:#fff;color:#161616;font-size:.85rem;font-weight:600;cursor:pointer}
  .toolbar select:hover{border-color:#1212ff}
  .toolbar select:focus-visible{outline:2px solid #000091;outline-offset:1px}
  .toolbar .sp{flex:1}
  .badge{font-size:.7rem;background:#e8edff;color:#000091;border:1px solid #b3c0f0;border-radius:4px;padding:.15rem .45rem;font-weight:700}
  .src{font-size:.75rem;color:#18753c}
  .src.sample{color:#b34000}
  .volbar{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:#fff;border-bottom:1px solid #eee;font-size:.78rem;color:#3a3a3a}
  .volbar .dot{width:.5rem;height:.5rem;border-radius:50%;background:#b34000;flex-shrink:0}
  .volbar strong{color:#161616}
  .wait{border:1px dashed #ccc;border-radius:8px;padding:1rem;color:#666;font-size:.85rem;background:#fafafa}
</style>
</head>
<body>
<div class="toolbar">
  <label for="f-period">Période</label>
  <select id="f-period">
    <option value="30d" title="Indicateurs mensuels : équivaut au dernier mois, en cours le cas échéant">30 derniers jours</option>
    <option value="3m">3 derniers mois</option>
    <option value="12m" selected>12 derniers mois</option>
    <option value="custom">Personnalisé…</option>
  </select>
  <span id="custom-range" hidden>
    <label for="f-from">Du</label>
    <select id="f-from" title="Début de période"></select>
    <label for="f-to">Au</label>
    <select id="f-to" title="Fin de période (mois de référence des cartes)"></select>
  </span>
  <label for="f-segment">Segment</label>
  <select id="f-segment">
    <option value="global">Tous les agents</option>
    <option value="ars">Agent ARS</option>
    <option value="regional">Référent régional</option>
    <option value="central">Administration centrale</option>
  </select>
  <span class="sp"></span>
  <span class="badge" id="badge">réel préprod</span>
  <span class="src" id="src">● source Grist</span>
</div>
<div class="volbar" id="volbar" hidden></div>
<div class="subtabs">
  <button class="subtab active" data-p="adoption">Adoption</button>
  <button class="subtab" data-p="recherche">Recherche</button>
  <button class="subtab" data-p="fonctionnalites">Fonctionnalités impactantes</button>
  <button class="subtab" data-p="navigation">Navigation</button>
</div>
<div class="panel active" id="p-adoption"><p class="muted">Chargement…</p></div>
<div class="panel" id="p-fonctionnalites"></div>
<div class="panel" id="p-recherche"></div>
<div class="panel" id="p-navigation"></div>

<script>
// ───────────────────────── Couche DATA (séparée du rendu, cf. gabarit DSFR) ─────────────────────────
// Source réelle = tables Grist (KPI + Base) lues via grist_plugin_api. Fallback preview = snapshot embarqué.
const SAMPLE = { kpi: [], base: [], events_agg: [] };  // vidé : données live via Grist uniquement
const state = { preset: '12m', from: null, to: null, segment: 'global' };  // preset (30d/3m/12m) ou custom (from→to)
let DATA = { kpi: [], base: [], meta: null };

// fetchTable renvoie du colonnaire {col:[...]} → on repasse en lignes.
function rowsFromColumnar(t) {
  const cols = Object.keys(t).filter(k => k !== 'manualSort');
  const n = (t.id || t[cols[0]] || []).length;
  const out = [];
  for (let i = 0; i < n; i++) { const r = {}; for (const c of cols) r[c] = t[c][i]; out.push(r); }
  return out;
}

// regroupe les lignes Events (déjà agrégées par l'ETL au grain mois × rôle) au format
// { month, role, category, action, name, n }. Chaque ligne porte son effectif dans `count`.
function aggEvents(rows) {
  const m = Object.create(null);
  for (const e of rows) {
    const k = [e.month, e.role, e.category, e.action, e.name || ''].join('|');
    const n = Number(e.count);
    m[k] = (m[k] || 0) + (Number.isFinite(n) && n > 0 ? n : 0);
  }
  return Object.entries(m).map(([k, n]) => { const [month, role, category, action, name] = k.split('|'); return { month, role, category, action, name, n }; });
}
// Les mois et les nombres servent de clés et partent dans innerHTML : une ligne au mois
// illisible (édition manuelle, ancien format) est écartée, un nombre illisible vaut null.
const MOIS_RE = /^\d{4}-(0[1-9]|1[0-2])$/;
const nombre = v => (v === null || v === undefined || v === '' || !Number.isFinite(Number(v)) ? null : Number(v));
function assainir({ kpi, base, events }) {
  const NUM_KPI = ['utilisateurs_reguliers', 'base_agents', 'taux_reguliers_pct', 'comparaisons', 'exports', 'listes', 'connexions', 'recherches'];
  return {
    kpi: kpi.filter(k => MOIS_RE.test(k.month)).map(k => { const r = { ...k }; for (const f of NUM_KPI) r[f] = nombre(k[f]); return r; }),
    base: base.filter(b => MOIS_RE.test(b.month)).map(b => ({ ...b, actifs: nombre(b.actifs), inactifs: nombre(b.inactifs) })),
    events_agg: aggEvents(events.filter(e => MOIS_RE.test(e.month))),
    meta: null,
  };
}
// Le mois calendaire en cours est PARTIEL : ses visiteurs distincts ne couvrent que les
// jours écoulés. Il est signalé, et on ne le compare pas à un mois complet.
const moisEnCours = () => new Date().toISOString().slice(0, 7);
// Après une panne de la collecte, le mois de la dernière extraction est lui aussi partiel.
const moisPartiel = m => m >= moisEnCours() || (DATA.nocturne && m >= String(DATA.nocturne.extracted_at || '').slice(0, 7));
const libMois = m => moisPartiel(m) ? `${m} (en cours)` : m;
const setSrc = (cls, txt) => { const s = document.getElementById('src'); s.className = 'src' + (cls ? ' ' + cls : ''); s.textContent = txt; };

async function loadData() {
  // seulement embarqué dans Grist (iframe) : évite que fetchTable reste en attente en preview autonome
  const inGrist = window.self !== window.top && window.grist && grist.docApi;
  if (inGrist) {
    try {
      const fetchAll = Promise.all([grist.docApi.fetchTable('KPI'), grist.docApi.fetchTable('Base'), grist.docApi.fetchTable('Events')]);
      const [kpi, base, events] = await Promise.race([fetchAll, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500))]);
      DATA = assainir({ kpi: rowsFromColumnar(kpi), base: rowsFromColumnar(base), events: rowsFromColumnar(events) });
      // table Extractions (optionnelle) : journal ETL → bandeau volumétrie. Isolée pour ne pas casser le load si absente.
      // La plus RÉCENTE, pas la dernière ligne : la collecte met sa ligne à jour en place.
      try {
        const ex = rowsFromColumnar(await grist.docApi.fetchTable('Extractions'));
        const plusRecente = (lignes) => lignes.reduce((a, r) => (!a || String(r.extracted_at || '') > String(a.extracted_at || '') ? r : a), null);
        DATA.meta = plusRecente(ex);
        // La borne des mois partiels ne vient que de la collecte NOCTURNE : un run manuel
        // ne relit qu'une fenêtre choisie et ne dit rien des mois tronqués par une panne.
        DATA.nocturne = plusRecente(ex.filter((r) => !/-manuel$/.test(String(r.run_id || ''))));
      } catch (e) {}
      setSrc('', '● source Grist (live)');
      return;
    } catch (e) {
      DATA = SAMPLE || { kpi: [], base: [], events_agg: [] };
      setSrc('sample', '● snapshot (autoriser « accès complet au document » pour le live)');
      return;
    }
  }
  DATA = SAMPLE || { kpi: [], base: [], events_agg: [] };
  setSrc('sample', '● snapshot Grist (preview)');
}

// ───────────────────────── Sélecteurs dérivés ─────────────────────────
const months = () => [...new Set(DATA.kpi.map(k => k.month))].sort();       // ancien → récent
// mois « exploitables » = base d'agents renseignée (dénominateur RC1 non nul) au niveau global
const monthsWithData = () => months().filter(m => hasData(m, 'global'));
const defaultTo = () => monthsWithData().at(-1) || months().at(-1);
// mois de référence des cartes = fin de période custom, sinon dernier mois exploitable (presets)
const curMonth = () => (state.preset === 'custom' && state.to && months().includes(state.to)) ? state.to : defaultTo();
// fenêtre d'évolution : plage custom Du→Au, ou N mois se terminant au mois courant (presets ; 30j = 1 mois)
function winMonths() {
  const mm = months(); if (!mm.length) return [];
  const to = curMonth();
  if (state.preset === 'custom') {
    let from = (state.from && mm.includes(state.from)) ? state.from : mm[0];
    if (from > to) from = to;
    return mm.filter(m => m >= from && m <= to);
  }
  const n = state.preset === '30d' ? 1 : state.preset === '3m' ? 3 : 12;
  const idx = mm.indexOf(to);
  return mm.slice(Math.max(0, idx + 1 - n), idx + 1);
}
// Un mois est MESURÉ quand son taux existe. La base seule ne suffit pas : la collecte
// laisse le taux vide sur une base incomplète ou incohérente (plus de réguliers que
// d'agents), et ce mois ne doit ni s'afficher en « null % » ni servir de référence.
const mesure = k => !!k && k.taux_reguliers_pct != null;
const hasData = (month, scope) => mesure(kpiOf(month, scope));
const kpiOf = (month, scope) => DATA.kpi.find(k => k.month === month && k.scope === scope) || null;
const baseRowsOf = (month, scope) => DATA.base.filter(b => b.month === month && (scope === 'global' || b.role === scope));
const ROLE_LABEL = { ars: 'Agent ARS', regional: 'Référent régional', central: 'Administration centrale' };
const num = n => (n == null ? '—' : Number(n).toLocaleString('fr-FR'));

// ── agrégats events (Recherche / Fonctionnalités / Navigation), filtrés mois + segment ──
const EV = () => DATA.events_agg || [];
const evRows = (cur, scope, pred) => EV().filter(e => e.month === cur && (scope === 'global' || e.role === scope) && pred(e));
const evSum = (cur, scope, pred) => evRows(cur, scope, pred).reduce((s, e) => s + e.n, 0);
function evGroup(cur, scope, pred, keyFn) {         // groupe + somme, trié desc
  const m = Object.create(null);
  for (const e of evRows(cur, scope, pred)) { const k = keyFn(e); m[k] = (m[k] || 0) + e.n; }
  return Object.entries(m).map(([label, n]) => ({ label, n })).sort((a, b) => b.n - a.n);
}
const NAME_LABEL = { zone_geo: 'Zone géographique', categorie_finess: 'Catégorie FINESS', type_structure: 'Type de structure', activites: 'Activités', recherche_avancee: 'Recherche avancée', liste: 'Liste', fiche_et: 'Fiche établissement', gestion_listes: 'Gestion des listes', comparaison: 'Comparaison', capacites: 'Capacités', cartographie: 'Cartographie', historique: 'Historique', aide: 'Aide' };
// Les libellés viennent de Grist, donc in fine du tracker public : échappés avant innerHTML.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const nl = s => esc(NAME_LABEL[s] || s || '—');
const pct = (n, tot) => tot ? Math.round(n / tot * 100) : 0;
const segLabel = scope => scope === 'global' ? 'tous les agents' : ROLE_LABEL[scope];
const breakdownTable = (rows, tot, head) => `<table><thead><tr><th>${head}</th><th class="num">Nombre</th><th class="num">%</th></tr></thead><tbody>
  ${rows.length ? rows.map(r => `<tr><td>${nl(r.label)}</td><td class="num">${num(r.n)}</td><td class="num">${pct(r.n, tot)} %</td></tr>`).join('') : '<tr><td colspan=3 class=muted>Aucune donnée</td></tr>'}
</tbody></table>`;

// mini-courbe d'évolution SVG (ligne monochrome, dernier point étiqueté) — gabarit DSFR
function sparkline(values, months, unit) {
  const W = 260, H = 70, pad = 6, n = values.length;
  if (n < 2) return '';
  const vmin = Math.min(...values), vmax = Math.max(...values);
  const span = (vmax - vmin) || 1;
  const x = i => pad + i * (W - 2 * pad) / (n - 1);
  const y = v => H - pad - (v - vmin) / span * (H - 2 * pad - 12);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const lastX = x(n - 1), lastY = y(values[n - 1]);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="évolution">
    <polyline points="${pts}" fill="none" stroke="#000091" stroke-width="2"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="#000091"/>
    <text x="${(lastX - 4).toFixed(1)}" y="${(lastY - 7).toFixed(1)}" text-anchor="end" font-size="11" fill="#000091" font-weight="700">${values[n-1]}${unit}</text>
    <text x="${pad}" y="${H - 1}" font-size="9" fill="#999">${months[0]}</text>
    <text x="${W - pad}" y="${H - 1}" text-anchor="end" font-size="9" fill="#999">${months[n-1]}</text>
  </svg>`;
}

// ───────────────────────── Rendu Adoption (fidèle au proto dsfr-dashboard.html) ─────────────────────────
function renderAdoption() {
  const scope = state.segment, cur = curMonth();
  const k = kpiOf(cur, scope);
  if (!k) { document.getElementById('p-adoption').innerHTML = '<p class="muted">Aucune donnée.</p>'; return; }

  // base BDD (actifs / inactifs) du mois courant pour le scope
  const brs = baseRowsOf(cur, scope);
  const actifs = brs.reduce((s, b) => s + (b.actifs || 0), 0);
  const inactifs = brs.reduce((s, b) => s + (b.inactifs || 0), 0);

  // Δ RC1 vs mois précédent EXPLOITABLE (base non nulle) : pas de delta inventé sur un mois vide
  const mm = months(), idx = mm.indexOf(cur);
  const prev = mm.slice(0, idx).reverse().find(m => hasData(m, scope));
  const kPrev = prev ? kpiOf(prev, scope) : null;
  const delta = (kPrev && mesure(k) && !moisPartiel(cur)) ? Math.round((k.taux_reguliers_pct - kPrev.taux_reguliers_pct) * 10) / 10 : null;
  const deltaTxt = delta == null ? '' : `${delta >= 0 ? '▲ +' : '▼ '}${delta} pt vs ${prev}`;

  // fenêtre d'évolution RC1 : plage Du → Au
  // Seuls les mois mesurés (base renseignée) sont tracés : un mois sans base n'est pas un 0 %.
  const win = winMonths().filter(m => hasData(m, scope));
  const evo = win.map(m => kpiOf(m, scope).taux_reguliers_pct ?? 0);
  const evoLabels = win.map(m => m.slice(5)); // MM

  // répartition par rôle (mois courant) — la segmentation exigée par le proto
  const roles = ['ars', 'regional', 'central'];

  document.getElementById('p-adoption').innerHTML = `
    <div class="cards">
      <div class="card">
        <div class="lbl">Taux d'utilisateurs réguliers · ${libMois(cur)}</div>
        ${mesure(k)
          ? `<div class="big">${k.taux_reguliers_pct} %</div>
             <div class="sub">${num(k.utilisateurs_reguliers)} réguliers / base ${num(k.base_agents)}</div>
             ${delta != null ? `<div class="delta">${deltaTxt}</div>` : ''}
             ${sparkline(evo, evoLabels, ' %')}`
          : `<div class="big" style="color:#929292">—</div><div class="sub muted">${k.base_agents ? 'Taux non calculable ce mois (base d\'agents incomplète ou incohérente).' : 'Données insuffisantes ce mois (base d\'agents non renseignée).'}</div>`}
      </div>
      <div class="card">
        <div class="lbl">Connexions · ${cur}</div>
        <div class="big">${num(k.connexions)}</div>
        <div class="sub">${num(k.utilisateurs_reguliers)} visiteur(s) unique(s) régulier(s)</div>
      </div>
      <div class="card">
        <div class="lbl">Actifs / Inactifs (BDD)</div>
        <div class="big">${num(actifs)} / ${num(inactifs)}</div>
        <div class="sub">Base totale ${num(actifs + inactifs)}</div>
      </div>
    </div>
    <h2>Répartition par segment (rôle) · ${cur}</h2>
    <table>
      <thead><tr><th>Segment</th><th class="num">Réguliers</th><th class="num">Connexions</th><th class="num">Base BDD</th><th class="num">Taux</th></tr></thead>
      <tbody>
        ${roles.map(r => { const kr = kpiOf(cur, r); if (!kr) return ''; return `<tr>
          <td>${ROLE_LABEL[r]}</td>
          <td class="num">${num(kr.utilisateurs_reguliers)}</td>
          <td class="num">${num(kr.connexions)}</td>
          <td class="num">${num(kr.base_agents)}</td>
          <td class="num">${mesure(kr) ? kr.taux_reguliers_pct + ' %' : '—'}</td></tr>`; }).join('')}
      </tbody>
    </table>
    <p class="muted">Source : doc Grist souverain (réguliers comptés par la collecte, base d'agents en table Base, taux calculé en formule Grist). ⓘ Taux d'utilisateurs réguliers = réguliers du mois / base d'agents (actifs + inactifs).</p>`;
}

// ───────────────────────── Fonctionnalités impactantes (RC2 / RC3 / RC4, données Grist) ─────────────────────────
function renderFonctio() {
  const scope = state.segment, cur = curMonth(), k = kpiOf(cur, scope);
  if (!k) { document.getElementById('p-fonctionnalites').innerHTML = '<p class="muted">Aucune donnée.</p>'; return; }
  const win = winMonths();
  const evoOf = f => win.map(m => (kpiOf(m, scope) || {})[f] ?? 0);
  const blocks = [
    ['Comparaisons lancées', k.comparaisons, 'comparaisons'],
    ['Exports lancés', k.exports, 'exports'],
    ['Listes créées', k.listes, 'listes'],
  ];
  const compSrc = evGroup(cur, scope, e => e.category === 'comparaison' && e.action === 'lancer', e => e.name);
  const expSrc = evGroup(cur, scope, e => e.category === 'export' && e.action === 'lancer', e => e.name);
  document.getElementById('p-fonctionnalites').innerHTML = `<div class="cards">
    ${blocks.map(([t, v, f]) => `<div class="card"><div class="lbl">${t} · mois courant</div>
      <div class="big">${num(v)}</div><div class="sub">volume d'events du mois</div>
      ${sparkline(evoOf(f), win.map(m => m.slice(5)), '')}</div>`).join('')}
  </div>
  <h2>Comparaisons par source d'origine</h2>${breakdownTable(compSrc, k.comparaisons, 'Source')}
  <h2>Exports par source d'origine</h2>${breakdownTable(expSrc, k.exports, 'Source')}
  <p class="muted">Source : doc Grist (Events). Segment : ${segLabel(scope)} · mois ${cur}. Les listes créées n'ont pas de source d'origine.</p>`;
}

// ───────────────────────── Recherche (recherche simple/avancée + filtres par critère) ─────────────────────────
function renderRecherche() {
  const scope = state.segment, cur = curMonth();
  const simple = evSum(cur, scope, e => e.category === 'recherche' && e.action === 'simple');
  const avancee = evSum(cur, scope, e => e.category === 'recherche' && e.action === 'avancee');
  const totalR = simple + avancee;
  const filtres = evSum(cur, scope, e => e.category === 'filtre' && e.action === 'appliquer');
  const parCritere = evGroup(cur, scope, e => e.category === 'filtre' && e.action === 'appliquer', e => e.name);
  document.getElementById('p-recherche').innerHTML = `<div class="cards">
    <div class="card"><div class="lbl">Recherches · mois courant</div><div class="big">${num(totalR)}</div><div class="sub">${num(simple)} simple / ${num(avancee)} avancée</div></div>
    <div class="card"><div class="lbl">Filtres appliqués · mois courant</div><div class="big">${num(filtres)}</div><div class="sub">sur ${parCritere.length} critère(s)</div></div>
  </div>
  <h2>Recherche simple vs avancée</h2>${breakdownTable([{ label: 'Recherche simple', n: simple }, { label: 'Recherche avancée', n: avancee }], totalR, 'Type de recherche')}
  <h2>Filtres appliqués par critère</h2>${breakdownTable(parCritere, filtres, 'Critère')}
  <p class="muted">Source : doc Grist (Events, categories recherche / filtre). Segment : ${segLabel(scope)} · mois ${cur}.</p>`;
}

// ───────────────────────── Navigation (accès aux pages transverses par destination) ─────────────────────────
function renderNavigation() {
  const scope = state.segment, cur = curMonth();
  const total = evSum(cur, scope, e => e.category === 'navigation');
  const parDest = evGroup(cur, scope, e => e.category === 'navigation', e => e.action);
  document.getElementById('p-navigation').innerHTML = `<div class="cards">
    <div class="card"><div class="lbl">Navigation transverse · mois courant</div><div class="big">${num(total)}</div><div class="sub">accès aux pages transverses</div></div>
  </div>
  <h2>Par destination</h2>${breakdownTable(parDest, total, 'Destination')}
  <p class="muted">Source : doc Grist (Events, category navigation). Segment : ${segLabel(scope)} · mois ${cur}.</p>`;
}

// ───────────────────────── Orchestration ─────────────────────────
const MONTH_FR = ['', 'janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const labelMonth = m => `${MONTH_FR[Number(m.slice(5))] || m.slice(5)} ${m.slice(0, 4)}`;

// bandeau volumétrie (lit la table Extractions via DATA.meta) : contextualise les faibles volumes
function renderBanner() {
  const el = document.getElementById('volbar');
  const m = DATA.meta;
  if (!m) { el.hidden = true; return; }
  const d = (m.extracted_at || '').slice(0, 10).split('-').reverse().join('/');
  el.hidden = false;
  el.innerHTML = `<span class="dot"></span><span><strong>Volumétrie de test</strong> · ${num(m.visits)} visite(s) sur la période${m.months ? ' ' + esc(m.months) : ''} · rôle peuplé ${num(m.role_fill_pct)}%${d ? ' · extraction du ' + esc(d) : ''}</span>`;
}

// remplit les sélecteurs Du / Au avec les mois présents (mois sans base signalés « vide »)
function fillMonthSelect() {
  const mm = months();
  const to = curMonth();
  const from = winMonths()[0] || mm[0];
  const opt = (m, sel) => `<option value="${m}"${m === sel ? ' selected' : ''}>${labelMonth(m)}${hasData(m, 'global') ? '' : ' (vide)'}</option>`;
  document.getElementById('f-from').innerHTML = mm.map(m => opt(m, from)).join('');
  document.getElementById('f-to').innerHTML = mm.map(m => opt(m, to)).join('');
}

// affiche les bornes Du/Au seulement en mode personnalisé
function updatePeriodUI() {
  const isCustom = state.preset === 'custom';
  document.getElementById('custom-range').hidden = !isCustom;
  if (isCustom) fillMonthSelect();
}

function renderAll() {
  renderBanner();
  renderAdoption(); renderRecherche(); renderFonctio(); renderNavigation();
}
document.querySelectorAll('.subtab').forEach(b => b.addEventListener('click', function () {
  document.querySelectorAll('.subtab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); document.getElementById('p-' + b.dataset.p).classList.add('active');
}));
document.getElementById('f-period').addEventListener('change', e => {
  state.preset = e.target.value;
  if (state.preset === 'custom') {
    const mm = months();
    if (!state.to) state.to = defaultTo();
    if (!state.from) state.from = mm[0] || state.to;
  }
  updatePeriodUI(); renderAll();
});
document.getElementById('f-from').addEventListener('change', e => { state.from = e.target.value || null; fillMonthSelect(); renderAll(); });
document.getElementById('f-to').addEventListener('change', e => { state.to = e.target.value || null; fillMonthSelect(); renderAll(); });
document.getElementById('f-segment').addEventListener('change', e => { state.segment = e.target.value; renderAll(); });

(async function init() {
  if (window.grist) { try { grist.ready(); } catch (e) {} }
  await loadData();
  fillMonthSelect();
  updatePeriodUI();
  renderAll();
  // recharge si Grist pousse une mise à jour
  if (window.grist && grist.onRecords) grist.onRecords(async () => { await loadData(); fillMonthSelect(); updatePeriodUI(); renderAll(); });
})();
</script>
</body>
</html>
