# Valeurs par défaut — surchargées par envs/<env>/values.yaml et par --set image.tag depuis la CI.

image:
  registry: ghcr.io/socialgouv
  # Tag commun aux deux images, positionné par la CI (sha-<gitsha>).
  tag: edge
  pullPolicy: IfNotPresent

# Liste des produits, un CronJob chacun. Jamais écrite à la main : elle est générée
# depuis les produits/<dept>/<nom>/produit.yaml par `scripts/produits-values.sh <env>`
# et passée en `-f`. Le marqueur doit valoir l'env déployé, sinon le rendu échoue.
produitsInventaire: ""
produits: []

cron:
  enabled: true
  # Tant que les tokens Matomo/Grist ne sont pas scellés, les CronJobs restent suspendus.
  suspend: true
  # Défaut, surchargeable par produit via `collecte.schedule` dans produit.yaml.
  schedule: "0 6 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  # Fenêtre de rattrapage d'un démarrage manqué. Borne aussi le compteur de
  # démarrages ratés, qui gèlerait la planification au bout de 100.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  # Coupe un job qui traîne (secondes).
  activeDeadlineSeconds: 1800
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

web:
  enabled: true
  replicas: 1
  port: 8080
  # host: défini par env
  ingress:
    className: nginx
    tlsSecretName: wildcard-crt
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # nginx-unprivileged tourne sous l'uid 101 et écoute sur 8080.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

networkPolicy:
  enabled: true

alerts:
  enabled: true
  # Au-delà de ce délai sans collecte réussie, on considère la chaîne muette.
  # Large devant la cadence quotidienne, pour ne pas alerter sur un retard normal.
  silenceMaxSeconds: 172800 # 48 h

# Appliqué au pod du CronJob.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
