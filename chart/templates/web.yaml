{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mesure-impact.name" . }}-web
  labels:
    {{- include "mesure-impact.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mesure-impact.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "mesure-impact.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "mesure-impact.image" (dict "root" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
{{- if gt (int .Values.web.replicas) 1 }}
---
# Empêche une éviction simultanée des deux répliques (drain de nœud, upgrade).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mesure-impact.name" . }}-web
  labels:
    {{- include "mesure-impact.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mesure-impact.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mesure-impact.name" . }}-web
  labels:
    {{- include "mesure-impact.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: {{ include "mesure-impact.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
{{- if not .Values.web.host }}
{{- fail "web.host est obligatoire : définis-le dans envs/<env>/values.yaml" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mesure-impact.name" . }}-web
  labels:
    {{- include "mesure-impact.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  ingressClassName: {{ .Values.web.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.web.host | quote }}
      secretName: {{ .Values.web.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.web.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mesure-impact.name" . }}-web
                port:
                  name: http
{{- end }}
