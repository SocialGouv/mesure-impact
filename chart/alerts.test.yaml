        values: '0+0x4000'
      - series: 'kube_cronjob_spec_suspend{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x600 1 0+0x3398'
    alert_rule_test:
      - eval_time: 3000m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
