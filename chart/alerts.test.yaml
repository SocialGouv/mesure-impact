# Tests unitaires des règles d'alerte, joués par `task test` via promtool sur le
# rendu réel du chart (scripts/test-alerts.sh). `rule_files` est réécrit par le script.
#
# Ce qui se joue ici : une alerte trop bavarde au démarrage est aussi nuisible qu'une
# alerte muette — au moment où l'alerting devient porteur, il crie déjà au loup.
rule_files: [rules.yaml]
evaluation_interval: 1m

tests:
  # Mise en service : déployé suspendu 10 jours puis activé. Grâce de 48 h, PUIS réveil.
  # Un test de grâce sans son assertion de réveil ne distingue pas grâce et mute permanent.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x4000'
      - series: 'kube_cronjob_created{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '-864000+0x4000'
      - series: 'kube_cronjob_spec_suspend{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x2880 0+0x1119'
    alert_rule_test:
      - { eval_time: 14480m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 16800m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - eval_time: 17400m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Même chose pour un CronJob qui avait DÉJÀ collecté (branche 1).
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x4000'
      - series: 'kube_cronjob_created{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '-864000+0x4000'
      - series: 'kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x4000'
      - series: 'kube_cronjob_spec_suspend{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x2880 0+0x1119'
    alert_rule_test:
      - { eval_time: 14480m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - eval_time: 17400m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
