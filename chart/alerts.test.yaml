# Tests unitaires des règles d'alerte, joués par `task test` via promtool sur le
# rendu réel du chart (scripts/test-alerts.sh). `rule_files` est réécrit par le script.
#
# Ce qui se joue ici : une alerte muette et une alerte qui crie au loup se valent.
# La matrice ci-dessous est l'accumulation de huit tours de revue adversariale sur
# `MesureImpactCollecteMuette` — chaque cas correspond à un faux positif ou à un faux
# négatif réellement observé sur une version précédente de la règle.
rule_files: [rules.yaml]
evaluation_interval: 5m

tests:
  # Il tourne, il n'a JAMAIS réussi : le cas le plus grave, et le plus simple à rater
  # (`last_successful_time` n'est pas exporté tant qu'aucun succès n'a eu lieu).
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x6000'
    alert_rule_test:
      - eval_time: 3000m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              namespace: mesure-impact-dev
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Il tourne, il a réussi il y a plus de 48 h.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x6000'
      - series: 'kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x6000'
    alert_rule_test:
      - eval_time: 3000m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              namespace: mesure-impact-dev
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Il tourne et il réussit : rien à signaler.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x6000'
      - series: 'kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x6000'
    alert_rule_test:
      - { eval_time: 3000m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 10000m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }

  # Suspendu : il ne déclenche plus, son horodatage vieillit, l'alerte se tait.
  # Les versions précédentes exigeaient une gymnastique sur `spec_suspend` pour ça.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x576 172800+0x5424'
      - series: 'kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x576 172800+0x5424'
    alert_rule_test:
      - { eval_time: 4000m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 10000m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }

  # Mise en service : suspendu 10 jours puis réactivé. Aucune alerte tant qu'il
  # n'a pas eu son exécution — la grâce est exacte, sans fenêtre ni seuil à régler.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x2880 0+300x3120'
    alert_rule_test:
      - { eval_time: 14405m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 14500m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }

  # Et une fois qu'il a tourné sans réussir, l'alerte revient.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x2880 864000+300x3120'
    alert_rule_test:
      - eval_time: 17000m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              namespace: mesure-impact-dev
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Un CronJob NEUF n'a pas d'horodatage de déclenchement : silence jusqu'à sa
  # première exécution, sans avoir à comparer sa date de création.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
    alert_rule_test:
      - { eval_time: 40m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 3000m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }

  # Deux exportateurs, l'un figé sur un cache périmé. `max by` retient le
  # déclenchement et le succès les plus récents : une série morte ne masque rien.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect", instance="ksm"}'
        values: '0+300x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect", instance="kubecost"}'
        values: '0+0x6000'
    alert_rule_test:
      - eval_time: 3000m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              namespace: mesure-impact-dev
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Deux produits, un seul en panne : l'agrégation par (namespace, cronjob) les sépare.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-autre-collect"}'
        values: '0+300x6000'
      - series: 'kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-autre-collect"}'
        values: '0+300x6000'
    alert_rule_test:
      - eval_time: 3000m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              namespace: mesure-impact-dev
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Maintenance sur un CronJob SAIN : suspendu 36 h, réactivé, redéclenche 24 h plus
  # tard. Aucune alerte pendant toute la séquence. C'est le cas que cinq versions
  # successives de cette règle ont raté, chacune à sa manière.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x720 216000+0x5280'
      - series: 'kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x720 216000+0x5280'
    alert_rule_test:
      - { eval_time: 2400m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 3700m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 5000m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }

  # Même séquence, mais la première exécution post-maintenance ÉCHOUE : l'alerte part
  # dès qu'il a réellement eu sa chance, et pas avant.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x720 216000+0x5280'
      - series: 'kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+0x6000'
    alert_rule_test:
      - { eval_time: 2400m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - { eval_time: 3550m, alertname: MesureImpactCollecteMuette, exp_alerts: [] }
      - eval_time: 3700m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              namespace: mesure-impact-dev
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Un geste opérateur de 30 min sur un CronJob cassé ne doit rien taire : il n'a
  # manqué aucune exécution. Une clause de rapport cyclique le taisait 48 h.
  - interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '1+0x6000'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mesure-impact-dev", cronjob="mesure-impact-sante-basavi-collect"}'
        values: '0+300x1000 300000+0x6 301800+300x4994'
    alert_rule_test:
      - eval_time: 8000m
        alertname: MesureImpactCollecteMuette
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteMuette
              namespace: mesure-impact-dev
              cronjob: mesure-impact-sante-basavi-collect
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect sans succès depuis trop longtemps"
              description: "Aucune collecte réussie pour mesure-impact-sante-basavi-collect depuis plus de 48 h. Panne silencieuse probable : les données affichées vieillissent sans que rien ne casse."

  # Un Job en échec récent : l'autre règle, bornée à la fenêtre de 24 h.
  - interval: 5m
    input_series:
      - series: 'kube_job_status_failed{namespace="mesure-impact-dev", job_name="mesure-impact-sante-basavi-collect-29000001"}'
        values: '1+0x100'
      - series: 'kube_job_created{namespace="mesure-impact-dev", job_name="mesure-impact-sante-basavi-collect-29000001"}'
        values: '0+0x100'
    alert_rule_test:
      - eval_time: 20m
        alertname: MesureImpactCollecteEnEchec
        exp_alerts:
          - exp_labels:
              alertname: MesureImpactCollecteEnEchec
              namespace: mesure-impact-dev
              job_name: mesure-impact-sante-basavi-collect-29000001
              environnement: dev
              severity: warning
            exp_annotations:
              summary: "Collecte mesure-impact-sante-basavi-collect-29000001 en échec"
              description: "Le job mesure-impact-sante-basavi-collect-29000001 du namespace mesure-impact-dev a échoué. Le tableau de bord concerné n'est plus alimenté."
