# Relais Matomo au niveau du serveur web : aucun code dans l'application.
#
# Deux emplacements, le `map` ne vivant qu'au niveau `http` :
#   - section 1 -> bloc `http` (une seule fois pour tout le serveur)
#   - section 2 -> bloc `server` du produit
#
# À remplacer :
#   /k7f3a9                             -> le préfixe neutre choisi pour le produit
#   matomo.fabrique.social.gouv.fr      -> l'instance Matomo
#   /etc/ssl/certs/ca-certificates.crt  -> le magasin de certificats de l'image si différent
#
# Le nom de l'instance est résolu au démarrage : sans DNS à ce moment-là, nginx refuse de
# démarrer. Si ce risque compte, passer par `resolver` et une variable dans proxy_pass.

# ===========================================================================
# Section 1 — au niveau `http`
# ===========================================================================

# L'IP transmise à Matomo est masquée au niveau du contrat : deux octets pour IPv4
# (a.b.0.0), les 48 premiers bits pour IPv6. Une forme non reconnue donne une valeur
# vide, et nginx n'envoie alors aucun en-tête : mieux vaut pas d'IP du tout qu'une IP
# entière transmise par inadvertance.
# Les règles sont évaluées dans l'ordre. Les formes IPv6 compressées ont chacune la
# leur : une règle unique à trois groupes produirait « 2001:db8::: » pour « 2001:db8::1 ».
map $remote_addr $ip_visiteur_anonymisee {
    "~^::ffff:(\d{1,3})\.(\d{1,3})\."                     "$1.$2.0.0";   # IPv4 en IPv6
    "~^(\d{1,3})\.(\d{1,3})\."                            "$1.$2.0.0";   # IPv4
    "~^([0-9a-f]{1,4}):([0-9a-f]{1,4}):([0-9a-f]{1,4}):"  "$1:$2:$3::";  # a:b:c:…
    "~^([0-9a-f]{1,4}):([0-9a-f]{1,4})::"                 "$1:$2::";     # a:b::…
    "~^([0-9a-f]{1,4})::"                                 "$1::";        # a::…
    "~^::"                                                "::";          # ::…
    default                                               "";
}

# ===========================================================================
# Section 2 — dans le bloc `server` du produit
# ===========================================================================

# Le script de mesure (matomo.js)
location = /k7f3a9/a.js {
    # limit_except laisserait passer HEAD : on s'en tient au contrat.
    if ($request_method != GET) { return 404; }

    proxy_pass https://matomo.fabrique.social.gouv.fr/matomo.js;

    # Aucun en-tête du navigateur n'est transmis par défaut : cookies, jetons et
    # en-têtes d'authentification ajoutés en amont restent chez le produit.
    proxy_pass_request_headers off;
    proxy_set_header Host matomo.fabrique.social.gouv.fr;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    proxy_hide_header Set-Cookie;

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# Le point de collecte (matomo.php)
location = /k7f3a9/c {
    if ($request_method !~ ^(GET|POST)$) { return 404; }
    client_max_body_size 64000;

    # La query string d'un hit porte l'URL visitée, le titre de page et l'identifiant
    # de visiteur : elle n'a rien à faire dans les journaux du produit.
    access_log off;

    proxy_pass https://matomo.fabrique.social.gouv.fr/matomo.php;

    proxy_pass_request_headers off;
    proxy_set_header Host matomo.fabrique.social.gouv.fr;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_set_header Content-Type $content_type;
    # L'IP du client vue par le produit, masquée, REMPLACE l'en-tête reçu : sinon un
    # visiteur choisirait l'IP enregistrée par Matomo. Derrière un ingress, déclarer
    # celui-ci au module realip (`set_real_ip_from <CIDR de l'ingress>;
    # real_ip_header X-Forwarded-For;`) : sans ça, $remote_addr est l'IP du pod ingress
    # et tous les hits du produit portent la même valeur.
    proxy_set_header X-Forwarded-For $ip_visiteur_anonymisee;
    proxy_hide_header Set-Cookie;

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# Tout autre chemin sous le préfixe : 404, rien n'est relayé.
location ^~ /k7f3a9/ {
    return 404;
}
