# Relais Matomo au niveau du serveur web : aucun code dans l'application.
# À inclure dans le bloc `server` du produit.
#
# À remplacer :
#   /k7f3a9                             -> le préfixe neutre choisi pour le produit
#   matomo.fabrique.social.gouv.fr      -> l'instance Matomo
#   /etc/ssl/certs/ca-certificates.crt  -> le magasin de certificats de l'image si différent
#
# Le nom de l'instance est résolu au démarrage : sans DNS à ce moment-là, nginx refuse de
# démarrer. Si ce risque compte, passer par `resolver` et une variable dans proxy_pass.

# Le script de mesure (matomo.js)
location = /k7f3a9/a.js {
    # limit_except laisserait passer HEAD : on s'en tient au contrat.
    if ($request_method != GET) { return 404; }

    proxy_pass https://matomo.fabrique.social.gouv.fr/matomo.js;

    # Aucun en-tête du navigateur n'est transmis par défaut : cookies, jetons et
    # en-têtes d'authentification ajoutés en amont restent chez le produit.
    proxy_pass_request_headers off;
    proxy_set_header Host matomo.fabrique.social.gouv.fr;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    proxy_hide_header Set-Cookie;

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# Le point de collecte (matomo.php)
location = /k7f3a9/c {
    if ($request_method !~ ^(GET|POST)$) { return 404; }
    client_max_body_size 64000;

    proxy_pass https://matomo.fabrique.social.gouv.fr/matomo.php;

    proxy_pass_request_headers off;
    proxy_set_header Host matomo.fabrique.social.gouv.fr;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_set_header Content-Type $content_type;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Set-Cookie;

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# Tout autre chemin sous le préfixe : 404, rien n'est relayé.
location ^~ /k7f3a9/ {
    return 404;
}
