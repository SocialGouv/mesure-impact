name: CI

on:
  pull_request:
    branches: [main]

# La CI ne fait que lire le dépôt et construire des images en local.
permissions:
  contents: read

jobs:
  checks:
    name: Portes de qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
      # Échoue si un produit.yaml est incomplet pour un env qu'il déclare cibler :
      # mieux vaut casser la PR que déployer un CronJob qui plantera au premier run.
      - name: Inventaire et rendu du chart, pour chaque env
        # `shell: bash` apporte -o pipefail. Sans lui, le shell par défaut est
        # `bash -e {0}` et le `| tee` ci-dessous avalerait le code de sortie du
        # générateur : un produit.yaml incomplet passerait la PR en vert.
        shell: bash
        run: |
          set -eu
          for env in dev prod; do
            echo "::group::$env"
            ./scripts/produits-values.sh "$env" | tee "$RUNNER_TEMP/produits-$env.yaml"
            helm lint chart/ --values "envs/$env/values.yaml" \
              --values "$RUNNER_TEMP/produits-$env.yaml"
            helm template mesure-impact chart/ \
              --namespace "mesure-impact-$env" \
              --values "envs/$env/values.yaml" \
              --values "$RUNNER_TEMP/produits-$env.yaml" > /dev/null
            echo "::endgroup::"
          done

      # Un inventaire de dev passé à la prod doit être refusé par le chart.
      - name: Le garde-fou d'inventaire refuse le mauvais env
        shell: bash
        run: |
          set -eu
          sortie=$(helm template mesure-impact chart/ \
               --namespace mesure-impact-prod \
               --values envs/prod/values.yaml \
               --values "$RUNNER_TEMP/produits-dev.yaml" 2>&1) && {
            echo "::error::le chart a accepté l'inventaire de dev pour la prod"
            exit 1
          }
          # Exiger la BONNE raison : sans ça, n'importe quelle erreur helm (values
          # absent, template cassé) ferait passer ce test pour vert.
          # L'inventaire de dev ne doit jamais servir à la prod : le chart doit le
          # refuser en nommant l'env, pas échouer pour une raison quelconque.
          case "$sortie" in
            *'inventaire'*'"prod"'*)
              echo "refus confirmé, pour la bonne raison" ;;
            *)
              echo "::error::refus obtenu, mais pas pour la raison attendue :"; echo "$sortie"
              exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Ces scripts ne tournent qu'à la main : sans cette porte, une faute de
      # syntaxe y dort jusqu'au jour où quelqu'un en a besoin.
      - name: Syntaxe des scripts shell
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find scripts -name '*.sh'); do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Syntaxe des collecteurs
        run: |
          set -eu
          files="docker/cron/collect.mjs $(find produits -name 'etl.mjs')"
          for f in $files; do
            echo "node --check $f"
            node --check "$f"
          done

      # Un produit collecté sans secret scellé déploierait un CronJob actif et muet :
      # `cron.suspend` vaut pour tout l'env, pas par produit. Vu ici, pas au merge.
      - name: Chaque produit collecté a son secret scellé
        shell: bash
        run: |
          set -euo pipefail
          for env in dev prod; do
            for slug in $(yq -r '.produits[].slug' "$RUNNER_TEMP/produits-$env.yaml"); do
              f="produits/$slug/secrets/$env.sealedsecret.yaml"
              [ -f "$f" ] || { echo "::error::$slug est collecté en $env sans $f"; exit 1; }
              attendu="mesure-impact-$(echo "$slug" | tr '/' '-')-tokens"
              obtenu=$(yq -r '.metadata.name' "$f")
              [ "$obtenu" = "$attendu" ] || { echo "::error::$f : nom '$obtenu', attendu '$attendu'"; exit 1; }
              ns=$(yq -r '.metadata.namespace' "$f")
              [ "$ns" = "mesure-impact-$env" ] || { echo "::error::$f : namespace '$ns', attendu 'mesure-impact-$env'"; exit 1; }
              echo "$slug/$env : $obtenu dans $ns"
            done
          done

      # Le scellement est en scope STRICT : le nom et le namespace font partie du
      # chiffré. Le nom rendu par le chart et celui du fichier viennent de deux
      # chaînes indépendantes — les comparer est le seul moyen de voir une dérive.
      - name: Le secretRef rendu pointe sur un secret fourni
        shell: bash
        run: |
          set -euo pipefail
          for env in dev prod; do
            # `yq` sans -N insère un `---` entre documents : il entrerait dans les deux
            # listes et `grep -qx ---` serait pris pour une option. Invisible à un produit,
            # rouge sur toutes les PR dès le second.
            fournis=$(find produits -path "*/secrets/$env.sealedsecret.yaml" -exec yq -r -N '.metadata.name' {} + | sort -u)
            attendus=$(helm template mesure-impact chart/ \
              --namespace "mesure-impact-$env" \
              --values "envs/$env/values.yaml" \
              --values "$RUNNER_TEMP/produits-$env.yaml" \
              | yq -r -N 'select(.kind == "CronJob") | .spec.jobTemplate.spec.template.spec.containers[].envFrom[].secretRef.name' | sort -u)
            # Une liste vide n'affirme rien : exiger autant de références que de produits,
            # sinon la porte devient muette le jour où le chart cesse d'exposer les tokens.
            attendu_n=$(yq -r '[.produits[]] | length' "$RUNNER_TEMP/produits-$env.yaml")
            obtenu_n=$(echo "$attendus" | grep -c . || true)
            [ "$obtenu_n" -eq "$attendu_n" ] \
              || { echo "::error::$env : $attendu_n produits dans l'inventaire mais $obtenu_n secretRef rendus"; exit 1; }
            for nom in $attendus; do
              echo "$fournis" | grep -qxF -- "$nom" \
                || { echo "::error::$env : le chart référence le secret '$nom', qu'aucun fichier scellé ne fournit"; exit 1; }
              echo "$env : $nom fourni"
            done
          done

      - name: Tests du tableau de bord, de l'ETL et du collecteur
        run: |
          set -eu
          node produits/sante/basavi/dashboard.test.mjs
          node produits/sante/basavi/etl.test.mjs
          node produits/sante/basavi/collecte.test.mjs

      # Version épinglée : une alerte qui ne peut pas se déclencher est aussi grave
      # qu'une alerte qui hurle, et ça ne se voit qu'en jouant les règles.
      - name: Installer promtool
        run: |
          set -euo pipefail
          v=2.55.0
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v$v/prometheus-$v.linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" "prometheus-$v.linux-amd64/promtool"
          echo "$RUNNER_TEMP/prometheus-$v.linux-amd64" >> "$GITHUB_PATH"

      - name: Tests des règles d'alerte
        run: ./scripts/test-alerts.sh dev

  images:
    name: Build des images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [cron, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build sans push : `deploy.yml` construit ces mêmes images au merge, un
      # Dockerfile cassé doit être vu ici et pas une fois sur main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: mesure-impact-${{ matrix.component }}:pr
          cache-from: type=gha,scope=${{ matrix.component }}

      # Le chart impose runAsNonRoot : le kubelet doit pouvoir constater que
      # l'utilisateur n'est pas root sans résoudre /etc/passwd.
      - name: L'image tourne sous un uid non-root numérique
        run: |
          set -eu
          user=$(docker image inspect mesure-impact-${{ matrix.component }}:pr --format '{{.Config.User}}')
          echo "USER = '$user'"
          case "$user" in
            "")       echo "::error::aucun USER dans l'image, elle tournerait en root"; exit 1 ;;
            *[!0-9]*) echo "::error::USER '$user' n'est pas numérique — runAsNonRoot fera échouer le pod"; exit 1 ;;
          esac
          # Comparaison numérique : `USER 00` est numérique et vaut pourtant root.
          [ "$((10#$user))" -ne 0 ] || { echo "::error::l'image tourne en root (uid $((10#$user)))"; exit 1; }
