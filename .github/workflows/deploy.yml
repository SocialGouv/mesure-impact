name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/socialgouv/mesure-impact

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [cron, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          push: true
          # `:edge` est mutable : ne le déplacer que depuis main, sinon un dispatch
          # depuis une branche non relue le ferait pointer sur du code arbitraire.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}-{1}:edge', env.IMAGE_PREFIX, matrix.component) || '' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Le dépôt GitOps consomme le chart comme artefact OCI versionné, jamais le
  # répertoire de travail : la version épingle à la fois le chart et l'image.
  chart:
    name: Publier le chart en OCI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Connexion à ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Le catalogue est embarqué à la publication : le dépôt de déploiement n'a
      # ainsi rien à dupliquer des produits, et ne peut pas dériver de leur source.
      - name: Embarquer le catalogue des produits
        run: |
          set -eu
          for env in dev prod; do
            ./scripts/produits-values.sh "$env" > "$RUNNER_TEMP/inv-$env.yaml"
            ENVNOM="$env" INV="$RUNNER_TEMP/inv-$env.yaml" \
              yq -i '.produitsCatalogue[strenv(ENVNOM)] = load(env(INV)).produits' chart/values.yaml
          done
          yq '.produitsCatalogue' chart/values.yaml

      - name: Package et push
        run: |
          set -eu
          sha8=$(echo "${{ github.sha }}" | cut -c1-8)
          # appVersion = tag d'image immuable : un seul sha pilote le chart ET l'image,
          # donc le GitOps n'a jamais à préciser image.tag.
          helm package chart/ \
            --version "0.0.0-sha.$sha8" \
            --app-version "sha-${{ github.sha }}" \
            --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/mesure-impact-0.0.0-sha.$sha8.tgz" \
            oci://ghcr.io/socialgouv/mesure-impact/charts
          echo "chart publié : 0.0.0-sha.$sha8"

  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    # Rattache le job à l'environnement GitHub du même nom : c'est là que se
    # posent les règles de protection (relecteurs requis avant un déploiement prod).
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Extract kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # Un CronJob par produit : la liste est dérivée des produit.yaml, jamais écrite à la main.
      - name: Inventaire des produits
        run: |
          ./scripts/produits-values.sh "$ENVIRONMENT" > "$RUNNER_TEMP/produits.values.yaml"
          cat "$RUNNER_TEMP/produits.values.yaml"

      # Chaque produit collecté DOIT avoir son secret scellé : `cron.suspend` vaut
      # false pour tout l'env, donc un produit sans secret naîtrait actif et
      # échouerait chaque nuit en CreateContainerConfigError, sans rien casser de visible.
      - name: Chaque produit collecté a son secret scellé
        run: |
          set -euo pipefail
          manquants=""
          for slug in $(yq -r '.produits[].slug' "$RUNNER_TEMP/produits.values.yaml"); do
            f="produits/$slug/secrets/$ENVIRONMENT.sealedsecret.yaml"
            [ -f "$f" ] || manquants="$manquants $slug"
          done
          if [ -n "$manquants" ]; then
            echo "::error::produits collectés en $ENVIRONMENT sans secret scellé :$manquants"
            echo "Sceller avec : PRODUIT=<dept>/<nom> ENV=$ENVIRONMENT task seal"
            exit 1
          fi
          echo "tous les produits de l'inventaire $ENVIRONMENT ont leur secret"

      - name: Apply sealed secrets
        run: |
          set -euo pipefail
          for f in $(find produits -path "*/secrets/$ENVIRONMENT.sealedsecret.yaml"); do
            echo "apply $f"
            kubectl apply -n "mesure-impact-$ENVIRONMENT" -f "$f"
          done

      # `kubectl apply` d'un SealedSecret réussit dès que l'objet est ACCEPTÉ ; le
      # déchiffrement est asynchrone et sealed-secrets n'installe aucun webhook
      # d'admission. Sans cette attente, un fichier indéchiffrable donne une CI verte
      # et une collecte morte, invisible jusqu'à l'échec du Job le lendemain matin.
      - name: Les secrets sont réellement déscellés
        run: |
          set -euo pipefail
          ns="mesure-impact-$ENVIRONMENT"
          for f in $(find produits -path "*/secrets/$ENVIRONMENT.sealedsecret.yaml"); do
            nom=$(yq -r '.metadata.name' "$f")
            for essai in $(seq 30); do
              kubectl -n "$ns" get secret "$nom" >/dev/null 2>&1 && break
              [ "$essai" -lt 30 ] || {
                echo "::error::$nom jamais déscellé après 90 s — le contrôleur a refusé le chiffré"
                kubectl -n "$ns" get sealedsecret "$nom" -o jsonpath='{.status}' || true
                exit 1; }
              sleep 3
            done
            for cle in MATOMO_TOKEN_AUTH GRIST_API_KEY; do
              kubectl -n "$ns" get secret "$nom" -o "jsonpath={.data.$cle}" | grep -q . \
                || { echo "::error::$nom déscellé mais la clé $cle est absente"; exit 1; }
            done
            echo "$nom : déscellé, 2 clés présentes"
          done

      - name: Helm upgrade
        run: |
          helm upgrade --install mesure-impact chart/ \
            --namespace "mesure-impact-$ENVIRONMENT" \
            --values "envs/$ENVIRONMENT/values.yaml" \
            --values "$RUNNER_TEMP/produits.values.yaml" \
            --set "image.tag=sha-${{ github.sha }}" \
            --atomic --timeout 5m

      - name: Rollout status
        shell: bash
        run: |
          set -euo pipefail
          ns="mesure-impact-$ENVIRONMENT"
          kubectl -n "$ns" rollout status deploy/mesure-impact-web --timeout=3m
          kubectl -n "$ns" get cronjob,deploy,ing,networkpolicy

          # Helm n'a encore jamais retiré de ressource sur cette release : vérifier que
          # le CronJob mono-produit a bien disparu, plutôt que de l'imprimer sans le lire.
          if kubectl -n "$ns" get cronjob mesure-impact-collect >/dev/null 2>&1; then
            echo "::error::le CronJob mono-produit mesure-impact-collect survit comme orphelin"
            exit 1
          fi

      # La NetworkPolicy ferme l'ingress et Helm l'applique AVANT le Deployment. Les
      # sondes venant du kubelet, un blocage du chemin d'entrée laisserait le pod Ready :
      # ni `--atomic` ni `rollout status` ne verraient un site injoignable.
      - name: Le site répond vraiment
        shell: bash
        run: |
          set -euo pipefail
          host=$(kubectl -n "mesure-impact-$ENVIRONMENT" get ing mesure-impact-web \
                   -o jsonpath='{.spec.rules[0].host}')
          echo "GET https://$host/"
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 --max-time 20 "https://$host/"
          echo "200 OK"
