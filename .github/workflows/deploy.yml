name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/socialgouv/mesure-impact

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [cron, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:edge
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Extract kubeconfig
        run: |
          echo -n "${{ secrets.KUBECONFIG }}" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # Un CronJob par produit : la liste est dérivée des produit.yaml, jamais écrite à la main.
      - name: Inventaire des produits
        run: |
          ./scripts/produits-values.sh > "$RUNNER_TEMP/produits.values.yaml"
          cat "$RUNNER_TEMP/produits.values.yaml"

      - name: Apply sealed secrets
        run: |
          files=$(find produits -path "*/secrets/$ENVIRONMENT.sealedsecret.yaml")
          if [ -z "$files" ]; then
            echo "::warning::aucun secret scellé pour $ENVIRONMENT — les CronJobs resteront inopérants"
            exit 0
          fi
          for f in $files; do
            echo "apply $f"
            kubectl apply -n "mesure-impact-$ENVIRONMENT" -f "$f"
          done

      - name: Helm upgrade
        run: |
          helm upgrade --install mesure-impact chart/ \
            --namespace "mesure-impact-$ENVIRONMENT" \
            --values "envs/$ENVIRONMENT/values.yaml" \
            --values "$RUNNER_TEMP/produits.values.yaml" \
            --set "image.tag=sha-${{ github.sha }}" \
            --atomic --timeout 5m

      - name: Rollout status
        run: |
          kubectl -n "mesure-impact-$ENVIRONMENT" rollout status deploy/mesure-impact-web --timeout=3m
          kubectl -n "mesure-impact-$ENVIRONMENT" get cronjob,deploy,ing
