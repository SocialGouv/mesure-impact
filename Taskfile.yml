version: "3"

vars:
  NAME: mesure-impact
  CONTEXT: ovh-dev
  KUBESEAL_CERT: https://kubeseal.ovh.fabrique.social.gouv.fr/v1/cert.pem
  RANCHER_PROJECT_ID: c-m-97jxtvnv:p-mrmrt
  PRODUITS_VALUES: /tmp/mesure-impact-produits.values.yaml

env:
  ENV: '{{.ENV | default "dev"}}'

tasks:
  default:
    desc: Liste les commandes
    silent: true
    cmd: task --list

  ns:
    desc: Affiche le namespace de l'env courant (ENV=dev|prod)
    silent: true
    cmd: echo "{{.NAME}}-$ENV"

  produits:
    desc: Liste les produits découverts dans produits/
    silent: true
    cmd: ./scripts/produits-values.sh $ENV

  produits:values:
    internal: true
    cmd: ./scripts/produits-values.sh $ENV > {{.PRODUITS_VALUES}}-$ENV

  test:
    desc: Tests — tableau de bord (Node) et règles d'alerte (promtool)
    cmds:
      - node produits/sante/basavi/dashboard.test.mjs
      - ./scripts/test-alerts.sh $ENV

  lint:
    desc: Lint du chart Helm
    deps: [produits:values]
    cmd: >
      helm lint chart/
      --values envs/$ENV/values.yaml
      --values {{.PRODUITS_VALUES}}-$ENV

  template:
    desc: Rend le chart pour l'env (ENV=dev|prod)
    deps: [produits:values]
    cmd: >
      helm template {{.NAME}} chart/
      --namespace {{.NAME}}-$ENV
      --values envs/$ENV/values.yaml
      --values {{.PRODUITS_VALUES}}-$ENV

  dry-run:
    desc: Rend le chart et le valide côté serveur
    deps: [produits:values]
    cmd: >
      helm template {{.NAME}} chart/
      --namespace {{.NAME}}-$ENV
      --values envs/$ENV/values.yaml
      --values {{.PRODUITS_VALUES}}-$ENV
      | kubectl --context {{.CONTEXT}} apply --dry-run=server -f -

  deploy:
    desc: Déploie l'env depuis le poste (kubeconfig local)
    deps: [produits:values]
    cmds:
      - task: secrets:apply
      - >
        helm --kube-context {{.CONTEXT}} upgrade --install {{.NAME}} chart/
        --namespace {{.NAME}}-$ENV
        --values envs/$ENV/values.yaml
        --values {{.PRODUITS_VALUES}}-$ENV
        --set image.tag=sha-$(git rev-parse HEAD)
        --atomic --timeout 5m

  secrets:apply:
    desc: Applique les SealedSecrets de tous les produits pour l'env
    cmds:
      - |
        set -eu
        trouves=$(find produits -path "*/secrets/$ENV.sealedsecret.yaml")
        if [ -z "$trouves" ]; then
          echo "aucun secret scellé pour ENV=$ENV — les CronJobs resteront inopérants" >&2
          exit 0
        fi
        for f in $trouves; do
          echo "apply $f"
          kubectl --context {{.CONTEXT}} apply -n {{.NAME}}-$ENV -f "$f"
        done

  seal:
    desc: >
      Scelle les tokens d'un produit pour un env.
      Usage : PRODUIT=sante/basavi ENV=dev MATOMO_TOKEN_AUTH=... GRIST_API_KEY=... task seal
      Les valeurs viennent de l'environnement — jamais de la ligne de commande, jamais d'un
      fichier en clair. La config non secrète vit dans produit.yaml, pas ici.
    cmds:
      - |
        set -eu
        [ -n "${PRODUIT:-}" ] || { echo "ERREUR: PRODUIT non défini (ex. PRODUIT=sante/basavi)" >&2; exit 1; }
        [ -f "produits/$PRODUIT/produit.yaml" ] || { echo "ERREUR: produits/$PRODUIT/produit.yaml introuvable" >&2; exit 1; }
        # Un env inconnu produirait un fichier chiffré, commité dans un dépôt public,
        # que la CI ne cherchera jamais — scellé pour un namespace qui n'existe pas.
        case "$ENV" in dev|prod) ;; *) echo "ERREUR: ENV inconnu '$ENV' (attendu: dev, prod)" >&2; exit 1 ;; esac
        for v in MATOMO_TOKEN_AUTH GRIST_API_KEY; do
          eval "value=\${$v:-}"
          [ -n "$value" ] || { echo "ERREUR: $v non défini dans l'environnement" >&2; exit 1; }
        done
        dept=$(dirname "$PRODUIT"); nom=$(basename "$PRODUIT")
        mkdir -p "produits/$PRODUIT/secrets"
        kubectl create secret generic "{{.NAME}}-$dept-$nom-tokens" \
          --namespace {{.NAME}}-$ENV \
          --from-literal=MATOMO_TOKEN_AUTH="$MATOMO_TOKEN_AUTH" \
          --from-literal=GRIST_API_KEY="$GRIST_API_KEY" \
          --dry-run=client -o yaml \
        | kubeseal --cert {{.KUBESEAL_CERT}} -o yaml \
        > "produits/$PRODUIT/secrets/$ENV.sealedsecret.yaml"
        echo "écrit: produits/$PRODUIT/secrets/$ENV.sealedsecret.yaml"

  run:cron:
    desc: Déclenche la collecte d'un produit à la main (PRODUIT=sante/basavi)
    cmds:
      - |
        set -eu
        [ -n "${PRODUIT:-}" ] || { echo "ERREUR: PRODUIT non défini (ex. PRODUIT=sante/basavi)" >&2; exit 1; }
        dept=$(dirname "$PRODUIT"); nom=$(basename "$PRODUIT")
        job="{{.NAME}}-$dept-$nom-manuel-$(date +%s)"
        kubectl --context {{.CONTEXT}} -n {{.NAME}}-$ENV \
          create job "$job" --from="cronjob/{{.NAME}}-$dept-$nom-collect"
        kubectl --context {{.CONTEXT}} -n {{.NAME}}-$ENV \
          wait --for=condition=complete --timeout=5m "job/$job" || true
        kubectl --context {{.CONTEXT}} -n {{.NAME}}-$ENV logs "job/$job" --tail=50

  logs:
    desc: Logs des pods de l'env
    cmd: >
      kubectl --context {{.CONTEXT}} -n {{.NAME}}-$ENV
      logs -l app.kubernetes.io/name={{.NAME}} --all-containers --tail=200 --prefix

  status:
    desc: État des ressources de l'env
    cmd: kubectl --context {{.CONTEXT}} -n {{.NAME}}-$ENV get cronjob,deploy,pod,ing,sealedsecret

  url:
    desc: Vérifie que le site et chaque dashboard répondent
    silent: true
    cmd: |
      set -eu
      host=$(yq '.web.host' envs/$ENV/values.yaml)
      printf '%-62s %s\n' "https://$host/" "$(curl -so /dev/null -w '%{http_code}' "https://$host/")"
      # Les dashboards sont servis pour tous les produits, y compris ceux qui ne
      # sont pas collectés dans cet env : c'est le front, pas la collecte.
      for m in $(find produits -mindepth 3 -maxdepth 3 -name produit.yaml); do
        d=$(dirname "$m"); chemin="$(basename "$(dirname "$d")")/$(basename "$d")"
        printf '%-62s %s\n' "https://$host/$chemin/" \
          "$(curl -so /dev/null -w '%{http_code}' "https://$host/$chemin/")"
      done

  kubeconfig:regen:
    desc: >
      Regénère le kubeconfig du bot Rancher et le repousse en secret GitHub.
      Requiert le mot de passe du bot dans RANCHER_BOT_PASSWORD (ou reset préalable
      côté Rancher, cf. l'en-tête du script).
    cmd: ./scripts/regen-kubeconfig.sh
